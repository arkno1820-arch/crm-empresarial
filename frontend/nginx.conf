server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # "no-cache" en teoría obliga a revalidar con el servidor, pero en la
    # práctica algunos navegadores igual reutilizan la copia local (por
    # ETag/Last-Modified poco confiables entre builds). "no-store" es más
    # estricto: prohíbe guardar la respuesta, así que SIEMPRE se pide de
    # nuevo al servidor. Esto evita que quede HTML nuevo con CSS/JS viejo
    # (o viceversa) después de cada deploy.
    location / {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(css|js)$ {
        add_header Cache-Control "no-store";
    }
}

# HTTPS con certificado autofirmado (no hay dominio propio). El navegador
# muestra una advertencia la primera vez; se acepta una sola vez por equipo.
server {
    listen 443 ssl;
    ssl_certificate     /etc/nginx/certs/frontend.crt;
    ssl_certificate_key /etc/nginx/certs/frontend.key;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(css|js)$ {
        add_header Cache-Control "no-store";
    }
}
