# Rutas compartidas entre el servidor HTTP (80) y HTTPS (443) del gateway.
# Vive en un archivo aparte (incluido con "include") para no mantener dos
# copias identicas de estos 6 bloques.
#
# Nota: al usar una variable en proxy_pass (para forzar la resolucion
# dinamica de "resolver" en nginx.conf), Nginx deja de recortar
# automaticamente el prefijo de la location — por eso el "rewrite ... break"
# explicito. Importante: "set" va ANTES del "rewrite ... break", porque
# "break" detiene el resto de directivas del modulo rewrite en la location
# (si "set" fuera despues, nunca se ejecutaria y la variable quedaria vacia).

location /api/auth/ {
    set $upstream_auth auth-service:8000;
    rewrite ^/api/auth/(.*)$ /$1 break;
    proxy_pass http://$upstream_auth;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

