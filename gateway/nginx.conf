events {
    worker_connections 1024;
}

http {
    # DNS interno de Docker: obliga a Nginx a resolver el nombre de cada
    # servicio en cada petición (con cache corta de 10s) en vez de resolverlo
    # una sola vez al arrancar. Sin esto, si un microservicio se reconstruye
    # y su contenedor cambia de IP, el gateway se queda con la IP vieja
    # (que puede terminar apuntando a OTRO servicio) hasta que lo reinicies
    # a mano — causando errores "Not Found" o respuestas cruzadas.
    resolver 127.0.0.11 valid=10s;

    # Por defecto Nginx corta cualquier subida mayor a 1MB (413 Request
    # Entity Too Large). El chat permite adjuntar archivos hasta 25MB
    # (limite real validado en chat-service), asi que se deja algo de
    # margen aqui para no bloquearlos antes de que lleguen al servicio.
    client_max_body_size 30M;

    # HTTP: se mantiene abierto por compatibilidad con lo que ya tenías
    # funcionando. Para tráfico cifrado, usa el puerto 443 (HTTPS) de abajo.
    server {
        listen 80;
        include /etc/nginx/locations.conf;
    }

    # HTTPS con certificado autofirmado (no hay dominio propio). El
    # navegador muestra una advertencia la primera vez; se acepta una sola
    # vez por equipo y no vuelve a preguntar.
    server {
        listen 443 ssl;
        ssl_certificate     /etc/nginx/certs/gateway.crt;
        ssl_certificate_key /etc/nginx/certs/gateway.key;
        include /etc/nginx/locations.conf;
    }
}
