events {
    worker_connections 1024;
}

http {
    upstream auth_service {
        server auth-service:8000;
    }
    upstream empleados_service {
        server empleados-service:8000;
    }
    upstream calendario_service {
        server calendario-service:8000;
    }
    upstream inventario_service {
        server inventario-service:8000;
    }
    upstream reservas_service {
        server reservas-service:8000;
    }

    server {
        listen 80;

        location /api/auth/ {
            proxy_pass http://auth_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/empleados/ {
            proxy_pass http://empleados_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/calendario/ {
            proxy_pass http://calendario_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/inventario/ {
            proxy_pass http://inventario_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/reservas/ {
            proxy_pass http://reservas_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location / {
            return 200 "CRM Empresarial - Gateway activo\n";
            add_header Content-Type text/plain;
        }
    }
}
