<rect x="60" y="540" width="1740" height="220" rx="18" fill="#20343f" stroke="#5fd3c8" stroke-width="2.5"/>
<text x="100" y="595" font-size="23" fill="#e8f1f2" font-weight="400" text-anchor="start">• El CRM siguió respondiendo: los microservicios corren activos en ambos núcleos y Nginx omite el núcleo caído.</text>
<text x="100" y="639" font-size="23" fill="#e8f1f2" font-weight="400" text-anchor="start">• La réplica era sincrónica: la última transacción confirmada fue a las 17:25:24, antes de la falla; no se perdió ninguna.</text>
<text x="100" y="683" font-size="23" fill="#e8f1f2" font-weight="400" text-anchor="start">• Solo la primera solicitud pagó una espera breve, después ajustada a 1 segundo (incidente 21).</text>
