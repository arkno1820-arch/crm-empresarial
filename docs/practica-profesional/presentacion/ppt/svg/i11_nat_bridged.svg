<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1860 800" width="1860" height="800" font-family="Segoe UI, Arial, sans-serif">
<defs>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#12232d" stroke-width="1"/></pattern>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <marker id="aC" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#5fd3c8"/></marker>
  <marker id="aA" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#f2b35a"/></marker>
  <marker id="aM" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#8ee6b8"/></marker>
  <marker id="aR" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#ef6b6b"/></marker>
</defs>
<rect width="1860" height="800" fill="#182a34"/><rect width="1860" height="800" fill="url(#grid)"/>
<rect x="40" y="60" width="880" height="640" rx="22" fill="#20343f" stroke="#ef6b6b" stroke-width="3" stroke-dasharray="10 8"/>
<text x="480" y="120" font-size="34" fill="#ef6b6b" font-weight="700" text-anchor="middle">Modo puenteado (bridged)</text>
<g transform="translate(440,145) scale(0.85)" fill="none" stroke="#ef6b6b" stroke-width="3.53" stroke-linecap="round" stroke-linejoin="round"><circle cx="50" cy="50" r="38"/><path d="M34 34 L66 66 M66 34 L34 66"/></g>
<text x="100" y="300" font-size="25" fill="#e8f1f2" font-weight="400" text-anchor="start">Las VMs quedan en la red externa</text>
<text x="100" y="338" font-size="25" fill="#e8f1f2" font-weight="400" text-anchor="start"></text>
<text x="100" y="376" font-size="25" fill="#e8f1f2" font-weight="400" text-anchor="start">• El hotspot descartaba las MAC de las VMs</text>
<text x="100" y="414" font-size="25" fill="#e8f1f2" font-weight="400" text-anchor="start">   anidadas (solo veía al PC)</text>
<text x="100" y="452" font-size="25" fill="#e8f1f2" font-weight="400" text-anchor="start">• A Proxmox le asignaron la IP del propio PC</text>
<text x="100" y="490" font-size="25" fill="#e8f1f2" font-weight="400" text-anchor="start">   y tumbó su conexión</text>
<text x="100" y="528" font-size="25" fill="#e8f1f2" font-weight="400" text-anchor="start">• Cada cambio de red obligaba a reconfigurar</text>
<text x="100" y="566" font-size="25" fill="#e8f1f2" font-weight="400" text-anchor="start">   todas las direcciones</text>
<rect x="940" y="60" width="880" height="640" rx="22" fill="#20343f" stroke="#8ee6b8" stroke-width="3" filter="url(#glow)"/>
<text x="1380" y="120" font-size="34" fill="#8ee6b8" font-weight="700" text-anchor="middle">Red NAT de VMware (elegida)</text>
<g transform="translate(1340,145) scale(0.85)" fill="none" stroke="#8ee6b8" stroke-width="3.53" stroke-linecap="round" stroke-linejoin="round"><circle cx="50" cy="50" r="38"/><path d="M32 52 L46 66 L70 36"/></g>
<text x="1000" y="300" font-size="25" fill="#e8f1f2" font-weight="400" text-anchor="start">La infraestructura vive detrás del PC</text>
<text x="1000" y="338" font-size="25" fill="#e8f1f2" font-weight="400" text-anchor="start"></text>
<text x="1000" y="376" font-size="25" fill="#e8f1f2" font-weight="400" text-anchor="start">• Una red privada propia: 192.168.80.0/24</text>
<text x="1000" y="414" font-size="25" fill="#e8f1f2" font-weight="400" text-anchor="start">• Proxmox reenvía solo los puertos necesarios</text>
<text x="1000" y="452" font-size="25" fill="#e8f1f2" font-weight="400" text-anchor="start">• Funciona igual con cualquier Wi-Fi o celular</text>
<text x="1000" y="490" font-size="25" fill="#e8f1f2" font-weight="400" text-anchor="start">• Las VMs no dependen de la red externa</text>
<text x="930" y="765" font-size="22" fill="#93a9b1" font-weight="400" text-anchor="middle" font-style="italic">Incidentes 13 y 14 de la bitácora · decisión ADR-06</text>
</svg>