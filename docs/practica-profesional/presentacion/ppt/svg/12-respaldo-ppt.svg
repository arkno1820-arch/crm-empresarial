<svg viewBox="0 0 1300 700" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1300" height="700" fill="#f4f5f2"/>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f6f68"/></marker>
  </defs>

  <text x="650" y="34" text-anchor="middle" font-size="26" font-weight="700" fill="#161b1a">Respaldo y recuperación: qué se copia, hacia dónde y cómo se protege</text>
  <text x="650" y="58" text-anchor="middle" font-size="15" fill="#535e5c">NAS simulada: contenedor crm-nas sobre un disco virtual alojado en el disco externo del PC</text>

  <!-- ===== LANE 1: flujo automatico (una sola linea, izquierda a derecha) ===== -->
  <rect x="20" y="76" width="1260" height="410" rx="14" fill="#eef2f0" stroke="#1f6f68" stroke-width="2"/>
  <text x="40" y="100" font-size="15" font-weight="700" fill="#0f403c">RESPALDO AUTOMÁTICO — cada noche, sin intervención (① → ② → ③ → ④)</text>

  <!-- flechas entre etapas -->
  <path d="M 304 210 L 341 210" stroke="#1f6f68" stroke-width="3" fill="none" marker-end="url(#a)"/>
  <path d="M 601 210 L 638 210" stroke="#1f6f68" stroke-width="3" fill="none" marker-end="url(#a)"/>
  <path d="M 898 210 L 935 210" stroke="#1f6f68" stroke-width="3" fill="none" marker-end="url(#a)"/>

  <!-- Etapa 1: nucleos -->
  <rect x="44" y="116" width="260" height="192" rx="10" fill="#ffffff" stroke="#1f6f68" stroke-width="2"/>
  <text x="174" y="142" text-anchor="middle" font-size="17" font-weight="700" fill="#0f403c">① Núcleos</text>
  <text x="174" y="163" text-anchor="middle" font-size="12.5" fill="#535e5c">generar, cifrar y subir</text>
  <line x1="60" y1="173" x2="288" y2="173" stroke="#d9dbd3"/>
  <text x="174" y="192" text-anchor="middle" font-size="13" font-weight="600" fill="#161b1a">crm-core · 03:00</text>
  <text x="174" y="210" text-anchor="middle" font-size="12" fill="#333">pg_dumpall → cifra (GPG) → SSH</text>
  <line x1="60" y1="222" x2="288" y2="222" stroke="#eceee8"/>
  <text x="174" y="240" text-anchor="middle" font-size="13" font-weight="600" fill="#161b1a">crm-core-b · 03:30</text>
  <text x="174" y="258" text-anchor="middle" font-size="12" fill="#333">mismos 3 pasos</text>
  <text x="174" y="286" text-anchor="middle" font-size="11.5" fill="#8a8f8a">clave pública de cifrado en cada núcleo;</text>
  <text x="174" y="300" text-anchor="middle" font-size="11.5" fill="#8a8f8a">la privada no existe aquí</text>

  <!-- Etapa 2: crm-nas -->
  <rect x="341" y="116" width="260" height="192" rx="10" fill="#ffffff" stroke="#1f6f68" stroke-width="2"/>
  <text x="471" y="142" text-anchor="middle" font-size="17" font-weight="700" fill="#0f403c">② crm-nas</text>
  <text x="471" y="163" text-anchor="middle" font-size="12.5" fill="#535e5c">recibe (contenedor 105)</text>
  <line x1="357" y1="173" x2="585" y2="173" stroke="#d9dbd3"/>
  <text x="471" y="195" text-anchor="middle" font-size="12.5" fill="#333">Receptor de SOLO ESCRITURA: la llave</text>
  <text x="471" y="213" text-anchor="middle" font-size="12.5" fill="#333">de cada núcleo solo sube un archivo</text>
  <text x="471" y="231" text-anchor="middle" font-size="12.5" fill="#333">nuevo (no lee, lista, sobrescribe ni borra)</text>
  <text x="471" y="256" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f6f68">/srv/respaldos/db</text>
  <text x="471" y="274" text-anchor="middle" font-size="12" fill="#535e5c">limpieza automática a los 30 días</text>
  <text x="471" y="296" text-anchor="middle" font-size="11.5" fill="#8a8f8a">salida propia: solo HTTPS hacia la nube</text>

  <!-- Etapa 3: almacenamiento -->
  <rect x="638" y="116" width="260" height="192" rx="10" fill="#ffffff" stroke="#1f6f68" stroke-width="2"/>
  <text x="768" y="142" text-anchor="middle" font-size="17" font-weight="700" fill="#0f403c">③ Almacenamiento</text>
  <text x="768" y="163" text-anchor="middle" font-size="12.5" fill="#535e5c">«nas-respaldos» · ext4 · 195 GB</text>
  <line x1="654" y1="173" x2="882" y2="173" stroke="#d9dbd3"/>
  <text x="768" y="193" text-anchor="middle" font-size="12.5" fill="#333">· BD cifrada, un archivo por noche</text>
  <text x="768" y="211" text-anchor="middle" font-size="12.5" fill="#333">(db-crm-core-…sql.gpg)</text>
  <text x="768" y="233" text-anchor="middle" font-size="12.5" fill="#b5651d">· VMs completas (vzdump, dump/):</text>
  <text x="768" y="251" text-anchor="middle" font-size="12.5" fill="#b5651d">flujo APARTE, domingos, ≈ 8,8 GB</text>
  <text x="768" y="277" text-anchor="middle" font-size="11.5" fill="#8a8f8a">disco raíz de crm-nas: K:\crm-nas\</text>
  <text x="768" y="292" text-anchor="middle" font-size="11.5" fill="#8a8f8a">respaldos.vmdk, en el disco externo (K:)</text>

  <!-- Etapa 4: nube -->
  <rect x="935" y="116" width="260" height="192" rx="10" fill="#eef4fb" stroke="#3b6fb5" stroke-width="2.4"/>
  <text x="1065" y="142" text-anchor="middle" font-size="17" font-weight="700" fill="#0f403c">④ Google Cloud</text>
  <text x="1065" y="163" text-anchor="middle" font-size="12.5" fill="#3b6fb5">bucket crm-chic-respaldos</text>
  <line x1="951" y1="173" x2="1179" y2="173" stroke="#c7d8ec"/>
  <text x="1065" y="195" text-anchor="middle" font-size="12.5" fill="#333">us-east1 · fuera del PC</text>
  <text x="1065" y="215" text-anchor="middle" font-size="12.5" fill="#333">credencial de solo-creación</text>
  <text x="1065" y="233" text-anchor="middle" font-size="12.5" fill="#333">(no lee, no lista, no borra)</text>
  <text x="1065" y="257" text-anchor="middle" font-size="12.5" font-weight="600" fill="#3b6fb5">cada noche 04:30</text>
  <text x="1065" y="275" text-anchor="middle" font-size="12" fill="#3b6fb5">verifica cada archivo por su MD5</text>

  <!-- satelite: Kuma, colgado solo de la etapa 2 -->
  <line x1="471" y1="308" x2="471" y2="330" stroke="#6b4c9a" stroke-width="2" stroke-dasharray="5,4"/>
  <rect x="341" y="330" width="260" height="86" rx="10" fill="#ffffff" stroke="#6b4c9a" stroke-width="1.6"/>
  <text x="471" y="352" text-anchor="middle" font-size="13.5" font-weight="700" fill="#161b1a">Uptime Kuma — monitores 11 y 12</text>
  <text x="471" y="371" text-anchor="middle" font-size="11.5" fill="#333">11 · enlace TCP :22 a crm-nas (30 s)</text>
  <text x="471" y="387" text-anchor="middle" font-size="11.5" fill="#333">12 · último respaldo: cada núcleo avisa</text>
  <text x="471" y="403" text-anchor="middle" font-size="11.5" fill="#6b4c9a">si pasan 26 h sin aviso, alarma en rojo</text>

  <!-- ===== LANE 2: restauracion, sin flechas cruzadas, solo referencia a ③ y ④ ===== -->
  <rect x="20" y="500" width="1260" height="130" rx="14" fill="#fbeeee" stroke="#8a3b3b" stroke-width="2"/>
  <text x="40" y="524" font-size="15" font-weight="700" fill="#8a3b3b">⟲ RESTAURACIÓN — manual, bajo pedido (no es automática ni continua)</text>

  <rect x="330" y="538" width="640" height="76" rx="10" fill="#ffffff" stroke="#8a3b3b" stroke-width="1.6"/>
  <text x="650" y="562" text-anchor="middle" font-size="13.5" fill="#333">El equipo del administrador toma un volcado de ③ Almacenamiento o de ④ Google Cloud, lo descifra con su</text>
  <text x="650" y="581" text-anchor="middle" font-size="13.5" fill="#333">clave PRIVADA de GPG (solo existe aquí, nunca en las VMs) y lo restaura para verificar, sin tocar la base real.</text>
  <text x="650" y="602" text-anchor="middle" font-size="13" font-weight="700" fill="#8a3b3b">Sin esta clave no hay restauración.</text>

  <text x="650" y="654" text-anchor="middle" font-size="13.5" fill="#535e5c">Tres copias en dos lugares: la base de datos vive en los núcleos, en la NAS del disco externo (mismo PC) y en Google Cloud Storage (fuera del PC).</text>
</svg>
