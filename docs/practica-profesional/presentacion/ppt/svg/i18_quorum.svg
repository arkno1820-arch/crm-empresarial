<text x="470" y="545" font-size="22" fill="#e8f1f2" font-weight="400" text-anchor="middle">Con 2 caídas simultáneas: 1 de 3 votos.</text>
<text x="470" y="577" font-size="22" fill="#e8f1f2" font-weight="400" text-anchor="middle">Sin mayoría: la base se detiene por</text>
<text x="470" y="609" font-size="22" fill="#e8f1f2" font-weight="400" text-anchor="middle">seguridad (sin split-brain) hasta que</text>
<text x="470" y="641" font-size="22" fill="#e8f1f2" font-weight="400" text-anchor="middle">vuelva la mayoría.</text>
<text x="470" y="675" font-size="19" fill="#ef6b6b" font-weight="600" text-anchor="middle">Límite real, visto en el incidente 20</text>
