<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1860 800" width="1860" height="800" font-family="Segoe UI, Arial, sans-serif">
<defs>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#12232d" stroke-width="1"/></pattern>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <marker id="aC" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#5fd3c8"/></marker>
  <marker id="aA" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#f2b35a"/></marker>
  <marker id="aM" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#8ee6b8"/></marker>
  <marker id="aR" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#ef6b6b"/></marker>
</defs>
<rect width="1860" height="800" fill="#182a34"/><rect width="1860" height="800" fill="url(#grid)"/>
<rect x="30" y="30" width="880" height="560" rx="22" fill="#20343f" stroke="#5fd3c8" stroke-width="3"/>
<text x="470" y="85" font-size="32" fill="#5fd3c8" font-weight="700" text-anchor="middle">La NAS es un buzón</text>
<g transform="translate(120,140) scale(1.1)" fill="none" stroke="#5fd3c8" stroke-width="2.73" stroke-linecap="round" stroke-linejoin="round"><rect x="10" y="24" width="80" height="54" rx="5"/><path d="M10 28 L50 56 L90 28"/></g>
<g transform="translate(370,140) scale(1.05)" fill="none" stroke="#8ee6b8" stroke-width="2.86" stroke-linecap="round" stroke-linejoin="round"><rect x="12" y="12" width="76" height="76" rx="6"/><circle cx="50" cy="50" r="20"/><circle cx="50" cy="50" r="6"/><path d="M50 30 V38 M50 62 V70 M30 50 H38 M62 50 H70"/><path d="M22 88 V94 M78 88 V94"/></g>
<g transform="translate(660,145) scale(1.0)" fill="none" stroke="#8ee6b8" stroke-width="3.00" stroke-linecap="round" stroke-linejoin="round"><path d="M28 72 C10 72 8 46 28 44 C28 22 62 16 70 40 C92 40 92 72 72 72 Z"/></g>
<line x1="255" y1="195" x2="365" y2="195" stroke="#8ee6b8" stroke-width="5" marker-end="url(#aM)"/>
<text x="310" y="165" font-size="20" fill="#8ee6b8" font-weight="600" text-anchor="middle">depositar</text>
<line x1="540" y1="195" x2="655" y2="195" stroke="#8ee6b8" stroke-width="4" stroke-dasharray="12 9" marker-end="url(#aM)"/>
<text x="598" y="165" font-size="18" fill="#8ee6b8" font-weight="600" text-anchor="middle">cada noche</text>
<text x="170" y="320" font-size="22" fill="#e8f1f2" font-weight="600" text-anchor="middle">Núcleo</text>
<text x="430" y="320" font-size="22" fill="#e8f1f2" font-weight="600" text-anchor="middle">crm-nas</text>
<text x="710" y="320" font-size="22" fill="#8ee6b8" font-weight="600" text-anchor="middle">Nube</text>
<text x="470" y="400" font-size="22" fill="#e8f1f2" font-weight="400" text-anchor="middle">Los núcleos solo pueden echar cartas al buzón:</text>
<text x="470" y="434" font-size="22" fill="#e8f1f2" font-weight="400" text-anchor="middle">no pueden abrirlo, mirar lo que hay adentro,</text>
<text x="470" y="468" font-size="22" fill="#e8f1f2" font-weight="400" text-anchor="middle">cambiar una carta ni sacarlas. crm-nas, a su vez,</text>
<text x="470" y="502" font-size="22" fill="#e8f1f2" font-weight="400" text-anchor="middle">reenvía cada noche una copia cifrada a la nube.</text>
<rect x="60" y="520" width="820" height="50" rx="12" fill="#182a34" stroke="#f2b35a" stroke-width="2"/>
<text x="470" y="554" font-size="22" fill="#f2b35a" font-weight="600" text-anchor="middle">Un núcleo comprometido no puede leer ni destruir los respaldos</text>
<text x="1370" y="70" font-size="28" fill="#8ee6b8" font-weight="700" text-anchor="middle">Pruebas de seguridad (6 de 6 rechazadas)</text>
<rect x="950" y="105" width="880" height="66" rx="12" fill="#20343f" stroke="#ef6b6b" stroke-width="2.5"/>
<g transform="translate(962,115) scale(0.44)" fill="none" stroke="#ef6b6b" stroke-width="6.82" stroke-linecap="round" stroke-linejoin="round"><circle cx="50" cy="50" r="38"/><path d="M34 34 L66 66 M66 34 L34 66"/></g>
<text x="1030" y="147" font-size="23" fill="#e8f1f2" font-weight="500" text-anchor="start">Listar carpetas de la NAS</text>
<text x="1810" y="147" font-size="21" fill="#93a9b1" font-weight="400" text-anchor="end">orden no permitida</text>
<rect x="950" y="183" width="880" height="66" rx="12" fill="#20343f" stroke="#ef6b6b" stroke-width="2.5"/>
<g transform="translate(962,193) scale(0.44)" fill="none" stroke="#ef6b6b" stroke-width="6.82" stroke-linecap="round" stroke-linejoin="round"><circle cx="50" cy="50" r="38"/><path d="M34 34 L66 66 M66 34 L34 66"/></g>
<text x="1030" y="225" font-size="23" fill="#e8f1f2" font-weight="500" text-anchor="start">Leer /etc/shadow</text>
<text x="1810" y="225" font-size="21" fill="#93a9b1" font-weight="400" text-anchor="end">orden no permitida</text>
<rect x="950" y="261" width="880" height="66" rx="12" fill="#20343f" stroke="#ef6b6b" stroke-width="2.5"/>
<g transform="translate(962,271) scale(0.44)" fill="none" stroke="#ef6b6b" stroke-width="6.82" stroke-linecap="round" stroke-linejoin="round"><circle cx="50" cy="50" r="38"/><path d="M34 34 L66 66 M66 34 L34 66"/></g>
<text x="1030" y="303" font-size="23" fill="#e8f1f2" font-weight="500" text-anchor="start">Sobrescribir un respaldo existente</text>
<text x="1810" y="303" font-size="21" fill="#93a9b1" font-weight="400" text-anchor="end">«ya existe»</text>
<rect x="950" y="339" width="880" height="66" rx="12" fill="#20343f" stroke="#ef6b6b" stroke-width="2.5"/>
<g transform="translate(962,349) scale(0.44)" fill="none" stroke="#ef6b6b" stroke-width="6.82" stroke-linecap="round" stroke-linejoin="round"><circle cx="50" cy="50" r="38"/><path d="M34 34 L66 66 M66 34 L34 66"/></g>
<text x="1030" y="381" font-size="23" fill="#e8f1f2" font-weight="500" text-anchor="start">Subir con una ruta relativa</text>
<text x="1810" y="381" font-size="21" fill="#93a9b1" font-weight="400" text-anchor="end">«nombre inválido»</text>
<rect x="950" y="417" width="880" height="66" rx="12" fill="#20343f" stroke="#ef6b6b" stroke-width="2.5"/>
<g transform="translate(962,427) scale(0.44)" fill="none" stroke="#ef6b6b" stroke-width="6.82" stroke-linecap="round" stroke-linejoin="round"><circle cx="50" cy="50" r="38"/><path d="M34 34 L66 66 M66 34 L34 66"/></g>
<text x="1030" y="459" font-size="23" fill="#e8f1f2" font-weight="500" text-anchor="start">Subir con extensión ajena</text>
<text x="1810" y="459" font-size="21" fill="#93a9b1" font-weight="400" text-anchor="end">«nombre inválido»</text>
<rect x="950" y="495" width="880" height="66" rx="12" fill="#20343f" stroke="#ef6b6b" stroke-width="2.5"/>
<g transform="translate(962,505) scale(0.44)" fill="none" stroke="#ef6b6b" stroke-width="6.82" stroke-linecap="round" stroke-linejoin="round"><circle cx="50" cy="50" r="38"/><path d="M34 34 L66 66 M66 34 L34 66"/></g>
<text x="1030" y="537" font-size="23" fill="#e8f1f2" font-weight="500" text-anchor="start">Orden vacía</text>
<text x="1810" y="537" font-size="21" fill="#93a9b1" font-weight="400" text-anchor="end">«nombre inválido»</text>
<rect x="30" y="620" width="1800" height="150" rx="18" fill="#20343f" stroke="#a99cf0" stroke-width="2.5" stroke-dasharray="10 8"/>
<g transform="translate(60,645) scale(0.7)" fill="none" stroke="#a99cf0" stroke-width="4.29" stroke-linecap="round" stroke-linejoin="round"><path d="M6 50 C22 22 78 22 94 50 C78 78 22 78 6 50 Z"/><circle cx="50" cy="50" r="15"/><circle cx="50" cy="50" r="5"/></g>
<text x="160" y="675" font-size="23" fill="#e8f1f2" font-weight="400" text-anchor="start">¿Y si el respaldo deja de correr sin que nadie lo note? Al terminar cada respaldo, el núcleo avisa a Kuma (monitor «push»).</text>
<text x="160" y="715" font-size="23" fill="#e8f1f2" font-weight="400" text-anchor="start">Si pasan 26 horas sin ningún aviso, el monitor «último respaldo» se pone en rojo.</text>
</svg>