<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1860 800" width="1860" height="800" font-family="Segoe UI, Arial, sans-serif">
<defs>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#12232d" stroke-width="1"/></pattern>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <marker id="aC" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#5fd3c8"/></marker>
  <marker id="aA" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#f2b35a"/></marker>
  <marker id="aM" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#8ee6b8"/></marker>
  <marker id="aR" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#ef6b6b"/></marker>
</defs>
<rect width="1860" height="800" fill="#182a34"/><rect width="1860" height="800" fill="url(#grid)"/>
<rect x="30" y="30" width="580" height="250" rx="20" fill="#20343f" stroke="#5fd3c8" stroke-width="3"/>
<g transform="translate(274,50) scale(0.9)" fill="none" stroke="#5fd3c8" stroke-width="3.33" stroke-linecap="round" stroke-linejoin="round"><circle cx="50" cy="50" r="38"/><ellipse cx="50" cy="50" rx="16" ry="38"/><path d="M12 50 H88 M18 30 H82 M18 70 H82"/></g>
<text x="320" y="190" font-size="28" fill="#5fd3c8" font-weight="700" text-anchor="middle">¿Sigue el servicio?</text>
<text x="320" y="230" font-size="21" fill="#e8f1f2" font-weight="400" text-anchor="middle">El CRM abierto, con sesión iniciada,</text>
<text x="320" y="260" font-size="21" fill="#e8f1f2" font-weight="400" text-anchor="middle">debe seguir respondiendo</text>
<rect x="640" y="30" width="580" height="250" rx="20" fill="#20343f" stroke="#a99cf0" stroke-width="3"/>
<g transform="translate(884,50) scale(0.9)" fill="none" stroke="#a99cf0" stroke-width="3.33" stroke-linecap="round" stroke-linejoin="round"><path d="M6 50 C22 22 78 22 94 50 C78 78 22 78 6 50 Z"/><circle cx="50" cy="50" r="15"/><circle cx="50" cy="50" r="5"/></g>
<text x="930" y="190" font-size="28" fill="#a99cf0" font-weight="700" text-anchor="middle">¿Lo detecta el monitoreo?</text>
<text x="930" y="230" font-size="21" fill="#e8f1f2" font-weight="400" text-anchor="middle">Los monitores afectados deben</text>
<text x="930" y="260" font-size="21" fill="#e8f1f2" font-weight="400" text-anchor="middle">ponerse en rojo con su alarma</text>
<rect x="1250" y="30" width="580" height="250" rx="20" fill="#20343f" stroke="#f2b35a" stroke-width="3"/>
<g transform="translate(1494,50) scale(0.9)" fill="none" stroke="#f2b35a" stroke-width="3.33" stroke-linecap="round" stroke-linejoin="round"><circle cx="50" cy="50" r="38"/><path d="M50 26 V50 L68 60"/></g>
<text x="1540" y="190" font-size="28" fill="#f2b35a" font-weight="700" text-anchor="middle">¿Cuánto tarda en recuperarse?</text>
<text x="1540" y="230" font-size="21" fill="#e8f1f2" font-weight="400" text-anchor="middle">Tiempos medidos con relojes reales,</text>
<text x="1540" y="260" font-size="21" fill="#e8f1f2" font-weight="400" text-anchor="middle">no estimados</text>
<text x="930" y="335" font-size="28" fill="#8ee6b8" font-weight="700" text-anchor="middle">Cuatro pruebas, cada una sobre una capa distinta</text>
<rect x="30" y="370" width="430" height="260" rx="20" fill="#20343f" stroke="#ef6b6b" stroke-width="3"/>
<text x="60" y="430" font-size="44" fill="#ef6b6b" font-weight="700" text-anchor="start">P1</text>
<text x="140" y="430" font-size="30" fill="#e8f1f2" font-weight="700" text-anchor="start">Núcleo</text>
<text x="60" y="490" font-size="22" fill="#e8f1f2" font-weight="400" text-anchor="start">Se apaga crm-core, líder de</text>
<text x="60" y="524" font-size="22" fill="#e8f1f2" font-weight="400" text-anchor="start">la base</text>
<rect x="485" y="370" width="430" height="260" rx="20" fill="#20343f" stroke="#f2b35a" stroke-width="3"/>
<text x="515" y="430" font-size="44" fill="#f2b35a" font-weight="700" text-anchor="start">P2</text>
<text x="595" y="430" font-size="30" fill="#e8f1f2" font-weight="700" text-anchor="start">Borde</text>
<text x="515" y="490" font-size="22" fill="#e8f1f2" font-weight="400" text-anchor="start">Se apaga crm-edge, dueño de</text>
<text x="515" y="524" font-size="22" fill="#e8f1f2" font-weight="400" text-anchor="start">la IP virtual</text>
<rect x="940" y="370" width="430" height="260" rx="20" fill="#20343f" stroke="#a99cf0" stroke-width="3"/>
<text x="970" y="430" font-size="44" fill="#a99cf0" font-weight="700" text-anchor="start">P3</text>
<text x="1050" y="430" font-size="30" fill="#e8f1f2" font-weight="700" text-anchor="start">Extrema</text>
<text x="970" y="490" font-size="22" fill="#e8f1f2" font-weight="400" text-anchor="start">Caen a la vez el monitoreo</text>
<text x="970" y="524" font-size="22" fill="#e8f1f2" font-weight="400" text-anchor="start">principal y un borde</text>
<rect x="1395" y="370" width="430" height="260" rx="20" fill="#20343f" stroke="#8ee6b8" stroke-width="3"/>
<text x="1425" y="430" font-size="44" fill="#8ee6b8" font-weight="700" text-anchor="start">P4</text>
<text x="1505" y="430" font-size="30" fill="#e8f1f2" font-weight="700" text-anchor="start">Planificada</text>
<text x="1425" y="490" font-size="22" fill="#e8f1f2" font-weight="400" text-anchor="start">Cambio de líder ordenado,</text>
<text x="1425" y="524" font-size="22" fill="#e8f1f2" font-weight="400" text-anchor="start">sin apagar nada</text>
<rect x="30" y="665" width="1800" height="105" rx="18" fill="#20343f" stroke="#5fd3c8" stroke-width="2.5" stroke-dasharray="10 8"/>
<text x="930" y="708" font-size="22" fill="#e8f1f2" font-weight="400" text-anchor="middle">El apagado es abrupto (Stop, no un cierre ordenado). La hora se toma del historial de tareas de Proxmox</text>
<text x="930" y="744" font-size="22" fill="#e8f1f2" font-weight="400" text-anchor="middle">y los eventos, de los registros de Patroni y Keepalived y del histórico de Kuma.</text>
</svg>