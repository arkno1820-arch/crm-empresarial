<text x="180" y="690" font-size="24" fill="#e8f1f2" font-weight="400" text-anchor="start">Analogía: la IP virtual es el número de un teléfono de atención. Si el operador de turno se cae,</text>
<text x="180" y="730" font-size="24" fill="#e8f1f2" font-weight="400" text-anchor="start">el número se desvía solo al escritorio de al lado; quien llama nunca cambia de número.</text>
