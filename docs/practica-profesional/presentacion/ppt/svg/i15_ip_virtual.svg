<text x="945" y="535" font-size="20" fill="#f2b35a" font-weight="400" text-anchor="middle">La IP salta sola a crm-edge-b</text>
<text x="945" y="563" font-size="20" fill="#f2b35a" font-weight="400" text-anchor="middle">en unos 3 segundos</text>
<text x="1555" y="535" font-size="20" fill="#e8f1f2" font-weight="400" text-anchor="middle">crm-edge recupera la IP por</text>
<text x="1555" y="563" font-size="20" fill="#e8f1f2" font-weight="400" text-anchor="middle">su prioridad mayor (≈ 4 s)</text>
