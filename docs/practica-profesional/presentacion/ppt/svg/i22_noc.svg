<text x="310" y="637" font-size="22" fill="#e8f1f2" font-weight="400" text-anchor="middle">vigila al principal y al servicio</text>
<text x="310" y="669" font-size="22" fill="#e8f1f2" font-weight="400" text-anchor="middle">de punta a punta</text>
