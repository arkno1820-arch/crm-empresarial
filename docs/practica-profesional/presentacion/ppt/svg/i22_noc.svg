<text x="310" y="322" font-size="22" fill="#e8f1f2" font-weight="400" text-anchor="middle">fuera de las VMs: si una VM se</text>
<text x="310" y="354" font-size="22" fill="#e8f1f2" font-weight="400" text-anchor="middle">cae, el vigilante sigue vivo</text>
