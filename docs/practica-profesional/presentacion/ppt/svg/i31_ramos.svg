<text x="970" y="255" font-size="21" fill="#e8f1f2" font-weight="400" text-anchor="start">Bucket real en Google Cloud</text>
<text x="970" y="285" font-size="21" fill="#e8f1f2" font-weight="400" text-anchor="start">Storage: IAM, credencial de</text>
