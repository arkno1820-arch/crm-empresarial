<text x="60" y="455" font-size="26" fill="#5fd3c8" font-weight="700" text-anchor="start">Gestión de Servicios TI</text>
<text x="60" y="489" font-size="26" fill="#5fd3c8" font-weight="700" text-anchor="start">(ITIL)</text>
<rect x="60" y="531" width="105" height="43" rx="21" fill="none" stroke="#5fd3c8" stroke-width="2.5"/>
<text x="78" y="564" font-size="21" fill="#5fd3c8" font-weight="600" text-anchor="start">Fuerte</text>
<text x="60" y="615" font-size="21" fill="#e8f1f2" font-weight="400" text-anchor="start">Bitácora de 33 incidentes y</text>
<text x="60" y="645" font-size="21" fill="#e8f1f2" font-weight="400" text-anchor="start">monitoreo NOC</text>
<rect x="485" y="400" width="430" height="320" rx="20" fill="#20343f" stroke="#a99cf0" stroke-width="3"/>
<text x="515" y="455" font-size="26" fill="#a99cf0" font-weight="700" text-anchor="start">Gestión de la Información</text>
<text x="515" y="489" font-size="26" fill="#a99cf0" font-weight="700" text-anchor="start">con TICs</text>
<rect x="515" y="531" width="105" height="43" rx="21" fill="none" stroke="#a99cf0" stroke-width="2.5"/>
<text x="533" y="564" font-size="21" fill="#a99cf0" font-weight="600" text-anchor="start">Fuerte</text>
<text x="515" y="615" font-size="21" fill="#e8f1f2" font-weight="400" text-anchor="start">Plataforma de código abierto y</text>
<text x="515" y="645" font-size="21" fill="#e8f1f2" font-weight="400" text-anchor="start">ampliamente adoptada (Proxmox VE);</text>
<text x="515" y="675" font-size="21" fill="#e8f1f2" font-weight="400" text-anchor="start">protección de datos con roles,</text>
<text x="515" y="705" font-size="21" fill="#e8f1f2" font-weight="400" text-anchor="start">cifrado y auditoría</text>
