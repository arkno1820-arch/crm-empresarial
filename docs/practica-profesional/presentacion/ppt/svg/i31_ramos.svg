<text x="515" y="255" font-size="21" fill="#e8f1f2" font-weight="400" text-anchor="start">VMware + Proxmox/KVM, LXC,</text>
<text x="515" y="285" font-size="21" fill="#e8f1f2" font-weight="400" text-anchor="start">recursos por VM</text>
