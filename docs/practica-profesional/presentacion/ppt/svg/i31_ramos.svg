<text x="970" y="455" font-size="26" fill="#8ee6b8" font-weight="700" text-anchor="start">Diseño y Arquitectura de</text>
<text x="970" y="489" font-size="26" fill="#8ee6b8" font-weight="700" text-anchor="start">Redes</text>
<rect x="970" y="531" width="151" height="43" rx="21" fill="none" stroke="#8ee6b8" stroke-width="2.5"/>
<text x="988" y="564" font-size="21" fill="#8ee6b8" font-weight="600" text-anchor="start">Más fuerte</text>
<text x="970" y="615" font-size="21" fill="#e8f1f2" font-weight="400" text-anchor="start">FCAPS: fallas, configuración,</text>
<text x="970" y="645" font-size="21" fill="#e8f1f2" font-weight="400" text-anchor="start">contabilidad, seguridad,</text>
<text x="970" y="675" font-size="21" fill="#e8f1f2" font-weight="400" text-anchor="start">rendimiento</text>
