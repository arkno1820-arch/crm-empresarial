<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1860 800" width="1860" height="800" font-family="Segoe UI, Arial, sans-serif">
<defs>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#12232d" stroke-width="1"/></pattern>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <marker id="aC" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#5fd3c8"/></marker>
  <marker id="aA" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#f2b35a"/></marker>
  <marker id="aM" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#8ee6b8"/></marker>
  <marker id="aR" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#ef6b6b"/></marker>
</defs>
<rect width="1860" height="800" fill="#182a34"/><rect width="1860" height="800" fill="url(#grid)"/>
<text x="300" y="70" font-size="34" fill="#f2b35a" font-weight="700" text-anchor="middle">El problema</text>
<rect x="60" y="140" width="190" height="70" rx="14" fill="#20343f" stroke="#f2b35a" stroke-width="2.5"/>
<text x="155" y="184" font-size="26" fill="#e8f1f2" font-weight="500" text-anchor="middle">Personal</text>
<rect x="260" y="180" width="190" height="70" rx="14" fill="#20343f" stroke="#f2b35a" stroke-width="2.5"/>
<text x="355" y="224" font-size="26" fill="#e8f1f2" font-weight="500" text-anchor="middle">Calendario</text>
<rect x="80" y="310" width="190" height="70" rx="14" fill="#20343f" stroke="#f2b35a" stroke-width="2.5"/>
<text x="175" y="354" font-size="26" fill="#e8f1f2" font-weight="500" text-anchor="middle">Inventario</text>
<rect x="270" y="350" width="190" height="70" rx="14" fill="#20343f" stroke="#f2b35a" stroke-width="2.5"/>
<text x="365" y="394" font-size="26" fill="#e8f1f2" font-weight="500" text-anchor="middle">Reservas</text>
<rect x="170" y="480" width="190" height="70" rx="14" fill="#20343f" stroke="#f2b35a" stroke-width="2.5"/>
<text x="265" y="524" font-size="26" fill="#e8f1f2" font-weight="500" text-anchor="middle">Chat</text>
<text x="300" y="650" font-size="24" fill="#93a9b1" font-weight="400" text-anchor="middle">Cada área trabajaba por su lado:</text>
<text x="300" y="684" font-size="24" fill="#93a9b1" font-weight="400" text-anchor="middle">datos dispersos y sin control</text>
<line x1="500" y1="300" x2="640" y2="300" stroke="#f2b35a" stroke-width="4" marker-end="url(#aA)"/>
<text x="930" y="70" font-size="34" fill="#5fd3c8" font-weight="700" text-anchor="middle">La exigencia</text>
<circle cx="930" cy="300" r="170" fill="#20343f" stroke="#5fd3c8" stroke-width="4" filter="url(#glow)"/>
<g transform="translate(880,200) scale(1.0)" fill="none" stroke="#5fd3c8" stroke-width="3.00" stroke-linecap="round" stroke-linejoin="round"><path d="M50 8 L86 22 V50 C86 72 68 86 50 94 C32 86 14 72 14 50 V22 Z"/><path d="M34 50 L46 62 L68 36"/></g>
<text x="930" y="350" font-size="36" fill="#5fd3c8" font-weight="700" text-anchor="middle">Ley 21.719</text>
<text x="930" y="392" font-size="26" fill="#e8f1f2" font-weight="400" text-anchor="middle">Protección de datos</text>
<text x="930" y="620" font-size="24" fill="#93a9b1" font-weight="400" text-anchor="middle">Hay datos de salud de los trabajadores:</text>
<text x="930" y="654" font-size="24" fill="#93a9b1" font-weight="400" text-anchor="middle">deben protegerse por ley</text>
<line x1="1110" y1="300" x2="1250" y2="300" stroke="#5fd3c8" stroke-width="4" marker-end="url(#aC)"/>
<text x="1560" y="70" font-size="34" fill="#8ee6b8" font-weight="700" text-anchor="middle">La solución</text>
<rect x="1360" y="150" width="400" height="300" rx="22" fill="#20343f" stroke="#8ee6b8" stroke-width="4" filter="url(#glow)"/>
<g transform="translate(1510,175) scale(0.95)" fill="none" stroke="#8ee6b8" stroke-width="3.16" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="30" width="84" height="46" rx="4"/><path d="M22 30 V76 M36 30 V76 M50 30 V76 M64 30 V76 M78 30 V76"/><path d="M8 30 L18 18 H82 L92 30"/></g>
<text x="1560" y="315" font-size="30" fill="#8ee6b8" font-weight="700" text-anchor="middle">CRM en microservicios</text>
<text x="1560" y="360" font-size="24" fill="#e8f1f2" font-weight="400" text-anchor="middle">Un servicio por función,</text>
<text x="1560" y="394" font-size="24" fill="#e8f1f2" font-weight="400" text-anchor="middle">todo bajo control de CHIC</text>
<text x="1560" y="620" font-size="24" fill="#93a9b1" font-weight="400" text-anchor="middle">Y una infraestructura propia</text>
<text x="1560" y="654" font-size="24" fill="#93a9b1" font-weight="400" text-anchor="middle">que lo mantenga siempre disponible</text>
<text x="930" y="760" font-size="24" fill="#93a9b1" font-weight="400" text-anchor="middle" font-style="italic">Centro CHIC · práctica profesional de 360 horas</text>
</svg>