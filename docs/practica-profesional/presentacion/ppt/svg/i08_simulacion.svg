<text x="250" y="620" font-size="25" fill="#e8f1f2" font-weight="400" text-anchor="start">Analogía: un piloto no vuela un avión comercial sin pasar antes por el simulador.</text>
<text x="250" y="660" font-size="25" fill="#e8f1f2" font-weight="400" text-anchor="start">Aquí se validó todo antes de tocar el servicio real de CHIC: la base de la migración a producción.</text>
<text x="250" y="700" font-size="25" fill="#e8f1f2" font-weight="400" text-anchor="start">Resultado: una infraestructura ya probada, lista para el paso siguiente del cronograma.</text>
