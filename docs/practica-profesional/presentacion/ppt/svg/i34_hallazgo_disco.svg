<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1860 800" width="1860" height="800" font-family="Segoe UI, Arial, sans-serif">
<defs>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#12232d" stroke-width="1"/></pattern>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <marker id="aC" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#5fd3c8"/></marker>
  <marker id="aA" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#f2b35a"/></marker>
  <marker id="aM" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#8ee6b8"/></marker>
  <marker id="aR" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#ef6b6b"/></marker>
</defs>
<rect width="1860" height="800" fill="#182a34"/><rect width="1860" height="800" fill="url(#grid)"/>
<text x="930" y="45" font-size="27" fill="#e8f1f2" font-weight="700" text-anchor="middle">Un hallazgo real: el almacenamiento compartido, puesto a prueba</text>
<rect x="40" y="110" width="430" height="400" rx="20" fill="#20343f" stroke="#ef6b6b" stroke-width="3"/>
<circle cx="100" cy="155" r="26" fill="#20343f" stroke="#ef6b6b" stroke-width="3"/>
<text x="100" y="164" font-size="26" fill="#ef6b6b" font-weight="700" text-anchor="middle">1</text>
<g transform="translate(213,165) scale(0.8)" fill="none" stroke="#ef6b6b" stroke-width="3.75" stroke-linecap="round" stroke-linejoin="round"><rect x="12" y="24" width="76" height="52" rx="8"/><circle cx="34" cy="50" r="12"/><circle cx="34" cy="50" r="3"/><path d="M58 40 H80 M58 50 H80 M58 60 H72"/></g>
<text x="255" y="320" font-size="23" fill="#ef6b6b" font-weight="700" text-anchor="middle">Se agota un disco, a</text>
<text x="255" y="349" font-size="23" fill="#ef6b6b" font-weight="700" text-anchor="middle">propósito</text>
<text x="255" y="395" font-size="18" fill="#e8f1f2" font-weight="400" text-anchor="middle">En una prueba de estrés se</text>
<text x="255" y="420" font-size="18" fill="#e8f1f2" font-weight="400" text-anchor="middle">llena por completo el disco</text>
<text x="255" y="445" font-size="18" fill="#e8f1f2" font-weight="400" text-anchor="middle">de una máquina, al límite</text>
<text x="255" y="470" font-size="18" fill="#e8f1f2" font-weight="400" text-anchor="middle">extremo</text>
<line x1="475" y1="300" x2="505" y2="300" stroke="#8ee6b8" stroke-width="3" marker-end="url(#aM)"/>
<rect x="490" y="110" width="430" height="400" rx="20" fill="#20343f" stroke="#f2b35a" stroke-width="3"/>
<circle cx="550" cy="155" r="26" fill="#20343f" stroke="#f2b35a" stroke-width="3"/>
<text x="550" y="164" font-size="26" fill="#f2b35a" font-weight="700" text-anchor="middle">2</text>
<g transform="translate(663,165) scale(0.8)" fill="none" stroke="#f2b35a" stroke-width="3.75" stroke-linecap="round" stroke-linejoin="round"><path d="M50 10 L92 86 H8 Z"/><path d="M50 38 V60"/><circle cx="50" cy="73" r="2"/></g>
<text x="705" y="320" font-size="23" fill="#f2b35a" font-weight="700" text-anchor="middle">Aparece un límite</text>
<text x="705" y="349" font-size="23" fill="#f2b35a" font-weight="700" text-anchor="middle">real</text>
<text x="705" y="395" font-size="18" fill="#e8f1f2" font-weight="400" text-anchor="middle">El almacenamiento</text>
<text x="705" y="420" font-size="18" fill="#e8f1f2" font-weight="400" text-anchor="middle">compartido del servidor se</text>
<text x="705" y="445" font-size="18" fill="#e8f1f2" font-weight="400" text-anchor="middle">queda sin espacio: dos</text>
<text x="705" y="470" font-size="18" fill="#e8f1f2" font-weight="400" text-anchor="middle">máquinas se pausan a la vez</text>
<line x1="925" y1="300" x2="955" y2="300" stroke="#8ee6b8" stroke-width="3" marker-end="url(#aM)"/>
<rect x="940" y="110" width="430" height="400" rx="20" fill="#20343f" stroke="#5fd3c8" stroke-width="3"/>
<circle cx="1000" cy="155" r="26" fill="#20343f" stroke="#5fd3c8" stroke-width="3"/>
<text x="1000" y="164" font-size="26" fill="#5fd3c8" font-weight="700" text-anchor="middle">3</text>
<g transform="translate(1113,165) scale(0.8)" fill="none" stroke="#5fd3c8" stroke-width="3.75" stroke-linecap="round" stroke-linejoin="round"><path d="M50 8 L86 22 V50 C86 72 68 86 50 94 C32 86 14 72 14 50 V22 Z"/><path d="M34 50 L46 62 L68 36"/></g>
<text x="1155" y="320" font-size="23" fill="#5fd3c8" font-weight="700" text-anchor="middle">El diseño protege</text>
<text x="1155" y="349" font-size="23" fill="#5fd3c8" font-weight="700" text-anchor="middle">los datos</text>
<text x="1155" y="395" font-size="18" fill="#e8f1f2" font-weight="400" text-anchor="middle">Patroni, por diseño, no</text>
<text x="1155" y="420" font-size="18" fill="#e8f1f2" font-weight="400" text-anchor="middle">promueve un nuevo líder si</text>
<text x="1155" y="445" font-size="18" fill="#e8f1f2" font-weight="400" text-anchor="middle">no está seguro: cero riesgo</text>
<text x="1155" y="470" font-size="18" fill="#e8f1f2" font-weight="400" text-anchor="middle">de datos incorrectos</text>
<line x1="1375" y1="300" x2="1405" y2="300" stroke="#8ee6b8" stroke-width="3" marker-end="url(#aM)"/>
<rect x="1390" y="110" width="430" height="400" rx="20" fill="#20343f" stroke="#8ee6b8" stroke-width="3"/>
<circle cx="1450" cy="155" r="26" fill="#20343f" stroke="#8ee6b8" stroke-width="3"/>
<text x="1450" y="164" font-size="26" fill="#8ee6b8" font-weight="700" text-anchor="middle">4</text>
<g transform="translate(1563,165) scale(0.8)" fill="none" stroke="#8ee6b8" stroke-width="3.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="50" cy="50" r="38"/><path d="M32 52 L46 66 L70 36"/></g>
<text x="1605" y="320" font-size="23" fill="#8ee6b8" font-weight="700" text-anchor="middle">Se corrige y se</text>
<text x="1605" y="349" font-size="23" fill="#8ee6b8" font-weight="700" text-anchor="middle">verifica</text>
<text x="1605" y="395" font-size="18" fill="#e8f1f2" font-weight="400" text-anchor="middle">Se amplía el almacenamiento</text>
<text x="1605" y="420" font-size="18" fill="#e8f1f2" font-weight="400" text-anchor="middle">y se reinicia; datos,</text>
<text x="1605" y="445" font-size="18" fill="#e8f1f2" font-weight="400" text-anchor="middle">usuarios y respaldos quedan</text>
<text x="1605" y="470" font-size="18" fill="#e8f1f2" font-weight="400" text-anchor="middle">intactos</text>
<rect x="30" y="540" width="1800" height="230" rx="22" fill="#20343f" stroke="#8ee6b8" stroke-width="3" filter="url(#glow)"/>
<g transform="translate(65,570) scale(0.85)" fill="none" stroke="#8ee6b8" stroke-width="3.53" stroke-linecap="round" stroke-linejoin="round"><circle cx="50" cy="50" r="38"/><path d="M32 52 L46 66 L70 36"/></g>
<text x="190" y="595" font-size="22" fill="#e8f1f2" font-weight="400" text-anchor="start">Resultado: cero pérdida de datos, usuarios y respaldos verificados intactos, y el servidor quedó con</text>
<text x="190" y="627" font-size="22" fill="#e8f1f2" font-weight="400" text-anchor="start">más margen de almacenamiento del que tenía antes de la prueba.</text>
<text x="190" y="680" font-size="20" fill="#f2b35a" font-weight="400" text-anchor="start">Este es el propósito de simular antes de producir: encontrar y corregir un límite real en un ambiente</text>
<text x="190" y="708" font-size="20" fill="#f2b35a" font-weight="400" text-anchor="start">de prueba, antes de que aparezca en el servidor que usará el Centro CHIC.</text>
</svg>