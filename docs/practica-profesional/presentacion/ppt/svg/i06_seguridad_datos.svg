<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1860 800" width="1860" height="800" font-family="Segoe UI, Arial, sans-serif">
<defs>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#12232d" stroke-width="1"/></pattern>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <marker id="aC" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#5fd3c8"/></marker>
  <marker id="aA" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#f2b35a"/></marker>
  <marker id="aM" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#8ee6b8"/></marker>
  <marker id="aR" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#ef6b6b"/></marker>
</defs>
<rect width="1860" height="800" fill="#182a34"/><rect width="1860" height="800" fill="url(#grid)"/>
<rect x="30" y="60" width="340" height="560" rx="20" fill="#20343f" stroke="#5fd3c8" stroke-width="3"/>
<circle cx="200" cy="160" r="60" fill="none" stroke="#5fd3c8" stroke-width="3" filter="url(#glow)"/>
<g transform="translate(158,118) scale(0.84)" fill="none" stroke="#5fd3c8" stroke-width="3.57" stroke-linecap="round" stroke-linejoin="round"><circle cx="30" cy="50" r="18"/><circle cx="30" cy="50" r="5"/><path d="M48 50 H92 M76 50 V64 M64 50 V60"/></g>
<text x="200" y="275" font-size="27" fill="#5fd3c8" font-weight="700" text-anchor="middle">Roles y permisos</text>
<text x="200" y="330" font-size="22" fill="#e8f1f2" font-weight="400" text-anchor="middle">4 perfiles, permisos</text>
<text x="200" y="364" font-size="22" fill="#e8f1f2" font-weight="400" text-anchor="middle">por módulo; el dato de</text>
<text x="200" y="398" font-size="22" fill="#e8f1f2" font-weight="400" text-anchor="middle">salud tiene su propio</text>
<text x="200" y="432" font-size="22" fill="#e8f1f2" font-weight="400" text-anchor="middle">permiso</text>
<rect x="394" y="60" width="340" height="560" rx="20" fill="#20343f" stroke="#8ee6b8" stroke-width="3"/>
<circle cx="564" cy="160" r="60" fill="none" stroke="#8ee6b8" stroke-width="3" filter="url(#glow)"/>
<g transform="translate(522,118) scale(0.84)" fill="none" stroke="#8ee6b8" stroke-width="3.57" stroke-linecap="round" stroke-linejoin="round"><rect x="20" y="42" width="60" height="46" rx="6"/><path d="M32 42 V30 C32 8 68 8 68 30 V42"/><circle cx="50" cy="63" r="6"/><path d="M50 69 V78"/></g>
<text x="564" y="275" font-size="27" fill="#8ee6b8" font-weight="700" text-anchor="middle">Cifrado en reposo</text>
<text x="564" y="330" font-size="22" fill="#e8f1f2" font-weight="400" text-anchor="middle">Alergias y medicamentos</text>
<text x="564" y="364" font-size="22" fill="#e8f1f2" font-weight="400" text-anchor="middle">se guardan cifrados</text>
<text x="564" y="398" font-size="22" fill="#e8f1f2" font-weight="400" text-anchor="middle">(Fernet): en la base</text>
<text x="564" y="432" font-size="22" fill="#e8f1f2" font-weight="400" text-anchor="middle">se ve «gAAAA…»</text>
<rect x="758" y="60" width="340" height="560" rx="20" fill="#20343f" stroke="#f2b35a" stroke-width="3"/>
<circle cx="928" cy="160" r="60" fill="none" stroke="#f2b35a" stroke-width="3" filter="url(#glow)"/>
<g transform="translate(886,118) scale(0.84)" fill="none" stroke="#f2b35a" stroke-width="3.57" stroke-linecap="round" stroke-linejoin="round"><circle cx="50" cy="50" r="38"/><path d="M32 52 L46 66 L70 36"/></g>
<text x="928" y="275" font-size="27" fill="#f2b35a" font-weight="700" text-anchor="middle">Consentimiento</text>
<text x="928" y="330" font-size="22" fill="#e8f1f2" font-weight="400" text-anchor="middle">Se registra la fecha</text>
<text x="928" y="364" font-size="22" fill="#e8f1f2" font-weight="400" text-anchor="middle">en que el trabajador</text>
<text x="928" y="398" font-size="22" fill="#e8f1f2" font-weight="400" text-anchor="middle">autoriza el uso de</text>
<text x="928" y="432" font-size="22" fill="#e8f1f2" font-weight="400" text-anchor="middle">sus datos de salud</text>
<rect x="1122" y="60" width="340" height="560" rx="20" fill="#20343f" stroke="#a99cf0" stroke-width="3"/>
<circle cx="1292" cy="160" r="60" fill="none" stroke="#a99cf0" stroke-width="3" filter="url(#glow)"/>
<g transform="translate(1250,118) scale(0.84)" fill="none" stroke="#a99cf0" stroke-width="3.57" stroke-linecap="round" stroke-linejoin="round"><path d="M6 50 C22 22 78 22 94 50 C78 78 22 78 6 50 Z"/><circle cx="50" cy="50" r="15"/><circle cx="50" cy="50" r="5"/></g>
<text x="1292" y="275" font-size="27" fill="#a99cf0" font-weight="700" text-anchor="middle">Historial</text>
<text x="1292" y="330" font-size="22" fill="#e8f1f2" font-weight="400" text-anchor="middle">Cada consulta o cambio</text>
<text x="1292" y="364" font-size="22" fill="#e8f1f2" font-weight="400" text-anchor="middle">de una ficha queda</text>
<text x="1292" y="398" font-size="22" fill="#e8f1f2" font-weight="400" text-anchor="middle">con usuario, fecha</text>
<text x="1292" y="432" font-size="22" fill="#e8f1f2" font-weight="400" text-anchor="middle">y acción</text>
<rect x="1486" y="60" width="340" height="560" rx="20" fill="#20343f" stroke="#ef6b6b" stroke-width="3"/>
<circle cx="1656" cy="160" r="60" fill="none" stroke="#ef6b6b" stroke-width="3" filter="url(#glow)"/>
<g transform="translate(1614,118) scale(0.84)" fill="none" stroke="#ef6b6b" stroke-width="3.57" stroke-linecap="round" stroke-linejoin="round"><path d="M10 24 H38 L46 34 H90 V84 H10 Z"/></g>
<text x="1656" y="275" font-size="27" fill="#ef6b6b" font-weight="700" text-anchor="middle">Anonimización</text>
<text x="1656" y="330" font-size="22" fill="#e8f1f2" font-weight="400" text-anchor="middle">Al «eliminar» un</text>
<text x="1656" y="364" font-size="22" fill="#e8f1f2" font-weight="400" text-anchor="middle">empleado se borran sus</text>
<text x="1656" y="398" font-size="22" fill="#e8f1f2" font-weight="400" text-anchor="middle">datos personales; se</text>
<text x="1656" y="432" font-size="22" fill="#e8f1f2" font-weight="400" text-anchor="middle">conserva lo laboral</text>
<rect x="30" y="650" width="1800" height="110" rx="18" fill="#20343f" stroke="#5fd3c8" stroke-width="2.5" stroke-dasharray="10 8"/>
<g transform="translate(60,665) scale(0.72)" fill="none" stroke="#5fd3c8" stroke-width="4.17" stroke-linecap="round" stroke-linejoin="round"><path d="M50 8 L86 22 V50 C86 72 68 86 50 94 C32 86 14 72 14 50 V22 Z"/><path d="M34 50 L46 62 L68 36"/></g>
<text x="150" y="700" font-size="24" fill="#e8f1f2" font-weight="400" text-anchor="start">Chat interno auditable: se avisa siempre al usuario, los mensajes se ven 30 días y solo el administrador puede auditarlos.</text>
<text x="150" y="738" font-size="24" fill="#e8f1f2" font-weight="400" text-anchor="start">Todo esto responde a la Ley 21.719 de protección de datos personales.</text>
</svg>