<svg viewBox="0 0 1080 560" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1080" height="560" fill="#f4f5f2"/>
  <text x="540" y="38" text-anchor="middle" font-size="26" font-weight="700" fill="#161b1a">Cronograma de la Práctica Profesional (Gantt) — 360 horas</text>
  <text x="540" y="60" text-anchor="middle" font-size="15" fill="#535e5c">28 de septiembre al 27 de noviembre de 2026 — jornada 09:00 a 17:30 hrs, lunes a viernes</text>

  <!-- Timeline axis: day 0 = 28-sep, day 60 = 27-nov. Scale: x = 90 + day*15.5 -->
  <g stroke="#d9dbd3" stroke-width="1">
    <line x1="90" y1="85" x2="90" y2="440"/>
    <line x1="245" y1="85" x2="245" y2="440"/>
    <line x1="400" y1="85" x2="400" y2="440"/>
    <line x1="555" y1="85" x2="555" y2="440"/>
    <line x1="710" y1="85" x2="710" y2="440"/>
    <line x1="865" y1="85" x2="865" y2="440"/>
    <line x1="1020" y1="85" x2="1020" y2="440"/>
  </g>
  <g font-size="13" fill="#666">
    <text x="90" y="78">28 sep</text>
    <text x="245" y="78">8 oct</text>
    <text x="400" y="78">18 oct</text>
    <text x="555" y="78">29 oct</text>
    <text x="710" y="78">8 nov</text>
    <text x="865" y="78">18 nov</text>
    <text x="1020" y="78">27 nov</text>
  </g>

  <!-- Phase bars: x = 90 + day*15.5 -->
  <!-- F1: dia 0-6, 30h -->
  <rect x="90" y="95" width="93" height="28" rx="4" fill="#1f6f68"/>
  <text x="8" y="114" font-size="14" fill="#161b1a">F1 Inducción y plan (30h)</text>

  <!-- F2: dia 7-13, 40h -->
  <rect x="198" y="133" width="93" height="28" rx="4" fill="#2a8a80"/>
  <text x="8" y="152" font-size="14" fill="#161b1a">F2 Validación de la aplicación (40h)</text>

  <!-- F3: dia 14-20, 45h -->
  <rect x="307" y="171" width="93" height="28" rx="4" fill="#3ba599"/>
  <text x="8" y="190" font-size="14" fill="#161b1a">F3 Validación de infraestructura y pruebas (45h)</text>

  <!-- F4: dia 21-34, 65h -->
  <rect x="416" y="209" width="201" height="28" rx="4" fill="#8a5a1c"/>
  <text x="8" y="228" font-size="14" fill="#161b1a">F4 Respaldo offsite en Oracle Cloud (65h)</text>

  <!-- F5: dia 35-41, 30h -->
  <rect x="633" y="247" width="93" height="28" rx="4" fill="#b57a2e"/>
  <text x="8" y="266" font-size="14" fill="#161b1a">F5 Cotización formal de servidor (30h)</text>

  <!-- F6: dia 42-48, 45h -->
  <rect x="742" y="285" width="93" height="28" rx="4" fill="#9b3b47"/>
  <text x="8" y="304" font-size="14" fill="#161b1a">F6 Pruebas integrales end-to-end (45h)</text>

  <!-- F7: dia 49-55, 45h -->
  <rect x="851" y="323" width="93" height="28" rx="4" fill="#c0524f"/>
  <text x="8" y="342" font-size="14" fill="#161b1a">F7 Documentación e informe final (45h)</text>

  <!-- F8: dia 56-60, 60h -->
  <rect x="958" y="361" width="62" height="28" rx="4" fill="#6b3fa0"/>
  <text x="8" y="380" font-size="14" fill="#161b1a">F8 PPT, video y entrega final (60h)</text>

  <!-- Milestones -->
  <g>
    <polygon points="400,415 409,406 418,415 409,424" fill="#161b1a"/>
    <text x="409" y="440" text-anchor="middle" font-size="12.5" fill="#161b1a">1er informe</text>
    <text x="409" y="453" text-anchor="middle" font-size="11" fill="#666">de avance (18 oct)</text>
  </g>
  <g>
    <polygon points="710,415 719,406 728,415 719,424" fill="#161b1a"/>
    <text x="719" y="440" text-anchor="middle" font-size="12.5" fill="#161b1a">2do informe</text>
    <text x="719" y="453" text-anchor="middle" font-size="11" fill="#666">de avance (8 nov)</text>
  </g>
  <g>
    <polygon points="944,415 953,406 962,415 953,424" fill="#161b1a"/>
    <text x="953" y="440" text-anchor="middle" font-size="12.5" fill="#161b1a">3er informe</text>
    <text x="953" y="453" text-anchor="middle" font-size="11" fill="#666">de avance (22 nov)</text>
  </g>
  <g>
    <polygon points="1020,415 1029,406 1038,415 1029,424" fill="#161b1a"/>
    <text x="1029" y="440" text-anchor="middle" font-size="12.5" fill="#161b1a">Entrega final</text>
    <text x="1029" y="453" text-anchor="middle" font-size="11" fill="#666">(27 nov)</text>
  </g>

  <!-- Pie explicativo -->
  <rect x="40" y="470" width="1000" height="75" rx="8" fill="#eceee8" stroke="#d9dbd3" stroke-width="1"/>
  <text x="60" y="492" font-size="13.5" font-weight="700" fill="#161b1a">Qué muestra este diagrama</text>
  <text x="60" y="510" font-size="12" fill="#535e5c">Distribuye las 360 horas oficiales de la práctica profesional en 8 fases dentro del periodo real (28-sep al 27-nov-2026). Las fases F2 y F3</text>
  <text x="60" y="525" font-size="12" fill="#535e5c">formalizan y validan el desarrollo técnico ya construido (aplicación e infraestructura); F4 y F5 son el trabajo pendiente genuino (backup</text>
  <text x="60" y="540" font-size="12" fill="#535e5c">offsite y cotización de servidor); F6-F8 cierran con pruebas finales y las entregas académicas (3 informes de avance, informe final, PPT, video).</text>
</svg>
