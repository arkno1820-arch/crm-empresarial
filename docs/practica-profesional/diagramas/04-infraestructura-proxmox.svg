<svg viewBox="0 0 1200 950" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1200" height="950" fill="#f4f5f2"/>

  <!-- Title -->
  <text x="600" y="38" text-anchor="middle" font-size="29.7" font-weight="700" fill="#161b1a">CRM Empresarial — Arquitectura de Virtualización y Redundancia</text>
  <text x="600" y="60" text-anchor="middle" font-size="17.6" fill="#535e5c">Proxmox VE 9.2 (anidado en VMware, red NAT) — un solo servidor físico — entorno de simulación</text>

  <!-- Red externa -->
  <ellipse cx="600" cy="102" rx="215" ry="28" fill="#ffffff" stroke="#8a8f8a" stroke-width="1.5"/>
  <text x="600" y="99" text-anchor="middle" font-size="17.6" fill="#333">Red externa del PC (Wi-Fi, hotspot o LAN)</text>
  <text x="600" y="117" text-anchor="middle" font-size="14.2" fill="#666">puede cambiar sin afectar a la infraestructura</text>
  <line x1="600" y1="130" x2="600" y2="152" stroke="#4b5563" stroke-width="2"/>

  <!-- PC fisico + VMware -->
  <rect x="270" y="152" width="660" height="48" rx="8" fill="#ffffff" stroke="#535e5c" stroke-width="1.5"/>
  <text x="600" y="172" text-anchor="middle" font-size="16.2" font-weight="700" fill="#161b1a">PC físico (Windows) + VMware Workstation</text>
  <text x="600" y="190" text-anchor="middle" font-size="14.2" fill="#535e5c">red virtual NAT VMnet8 — 192.168.80.0/24 (puerta de enlace 192.168.80.2)</text>
  <line x1="600" y1="200" x2="600" y2="224" stroke="#4b5563" stroke-width="2"/>

  <!-- Proxmox outer box -->
  <rect x="50" y="224" width="1100" height="672" rx="14" fill="#ffffff" stroke="#1f6f68" stroke-width="2"/>
  <text x="70" y="250" font-size="18.9" font-weight="700" fill="#0f403c">Proxmox VE — hipervisor (un solo host físico) — 192.168.80.10</text>

  <!-- vmbr0 -->
  <rect x="90" y="266" width="1020" height="32" rx="6" fill="#e2efec" stroke="#1f6f68" stroke-width="1"/>
  <text x="110" y="287" font-size="16.9" fill="#0f403c" font-weight="600">vmbr0 — 192.168.80.10/24, hacia VMnet8. El host Proxmox actúa como router de las VMs</text>

  <!-- NAT badge -->
  <rect x="90" y="306" width="1020" height="46" rx="8" fill="#fdf4e9" stroke="#8a5a1c" stroke-width="1"/>
  <text x="600" y="326" text-anchor="middle" font-size="14.9" font-weight="700" fill="#8a5a1c">DNAT: 80/443 → VIP 10.10.10.5 · 2211/2212 → SSH de cada borde  |  MASQUERADE de salida solo para crm-edge y crm-edge-b</text>
  <text x="600" y="343" text-anchor="middle" font-size="13.5" fill="#8a5a1c">Script /etc/network/if-up.d/crm-nat (idempotente, se reaplica en cada arranque)</text>
  <line x1="275" y1="352" x2="275" y2="386" stroke="#1f6f68" stroke-width="2"/>
  <line x1="925" y1="352" x2="925" y2="386" stroke="#8a8f8a" stroke-width="2" stroke-dasharray="4,3"/>

  <!-- Par de borde -->
  <text x="600" y="376" text-anchor="middle" font-size="14.9" fill="#0f403c" font-weight="700">PAR DE BORDE — redundante con Keepalived/VRRP</text>

  <rect x="110" y="388" width="330" height="134" rx="10" fill="#ffffff" stroke="#1f6f68" stroke-width="2"/>
  <text x="275" y="412" text-anchor="middle" font-size="20.3" font-weight="700" fill="#161b1a">crm-edge</text>
  <text x="275" y="428" text-anchor="middle" font-size="14.9" fill="#535e5c">2 vCPU / 2 GB — ACTIVO (prioridad 150)</text>
  <line x1="130" y1="436" x2="420" y2="436" stroke="#d9dbd3" stroke-width="1"/>
  <text x="275" y="454" text-anchor="middle" font-size="15.5" fill="#333">Nginx (nativo) + frontend estático</text>
  <text x="275" y="474" text-anchor="middle" font-size="14.2" fill="#666">eth0: 10.10.10.2 (vmbr1 — única interfaz)</text>
  <text x="275" y="494" text-anchor="middle" font-size="14.2" fill="#666">Uptime Kuma (monitoreo)</text>
  <text x="275" y="512" text-anchor="middle" font-size="14.2" fill="#0f403c" font-weight="600">Keepalived: MASTER</text>

  <rect x="760" y="388" width="330" height="134" rx="10" fill="#fbfbfa" stroke="#8a8f8a" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="925" y="412" text-anchor="middle" font-size="20.3" font-weight="700" fill="#161b1a">crm-edge-b</text>
  <text x="925" y="428" text-anchor="middle" font-size="14.9" fill="#535e5c">2 vCPU / 2 GB — EN ESPERA (prioridad 100)</text>
  <line x1="780" y1="436" x2="1070" y2="436" stroke="#d9dbd3" stroke-width="1"/>
  <text x="925" y="454" text-anchor="middle" font-size="15.5" fill="#333">Nginx (nativo) + frontend estático</text>
  <text x="925" y="474" text-anchor="middle" font-size="14.2" fill="#666">eth0: 10.10.10.3 (vmbr1 — única interfaz)</text>
  <text x="925" y="512" text-anchor="middle" font-size="14.2" fill="#8a8f8a" font-weight="600">Keepalived: BACKUP</text>

  <!-- VIP -->
  <rect x="490" y="426" width="220" height="62" rx="8" fill="#e2efec" stroke="#1f6f68" stroke-width="1.5"/>
  <text x="600" y="446" text-anchor="middle" font-size="14.2" font-weight="700" fill="#0f403c">IP virtual (VRRP)</text>
  <text x="600" y="463" text-anchor="middle" font-size="16.2" font-weight="700" fill="#0f403c">10.10.10.5</text>
  <text x="600" y="479" text-anchor="middle" font-size="12.8" fill="#535e5c">salta al nodo sano automáticamente</text>
  <line x1="440" y1="457" x2="490" y2="457" stroke="#1f6f68" stroke-width="1.5"/>
  <line x1="710" y1="457" x2="760" y2="457" stroke="#8a8f8a" stroke-width="1.5" stroke-dasharray="4,3"/>

  <line x1="275" y1="522" x2="275" y2="556" stroke="#1f6f68" stroke-width="2"/>
  <line x1="925" y1="522" x2="925" y2="556" stroke="#8a8f8a" stroke-width="2" stroke-dasharray="4,3"/>

  <!-- vmbr1 -->
  <rect x="90" y="556" width="1020" height="32" rx="6" fill="#f4e9d7" stroke="#8a5a1c" stroke-width="1"/>
  <text x="110" y="577" font-size="16.9" fill="#8a5a1c" font-weight="600">vmbr1 — red interna 10.10.10.0/24 (gateway 10.10.10.1 = Proxmox), sin puerto físico</text>

  <!-- Par de nucleo -->
  <text x="600" y="610" text-anchor="middle" font-size="14.9" fill="#8a5a1c" font-weight="700">PAR DE NÚCLEO — réplica de Postgres, promoción manual</text>
  <line x1="275" y1="588" x2="275" y2="624" stroke="#8a5a1c" stroke-width="2"/>
  <line x1="925" y1="588" x2="925" y2="624" stroke="#8a5a1c" stroke-width="2" stroke-dasharray="4,3"/>

  <rect x="110" y="626" width="330" height="184" rx="10" fill="#ffffff" stroke="#8a5a1c" stroke-width="2"/>
  <text x="275" y="652" text-anchor="middle" font-size="20.3" font-weight="700" fill="#161b1a">crm-core</text>
  <text x="275" y="668" text-anchor="middle" font-size="14.9" fill="#535e5c">4 vCPU / 6 GB — ACTIVO (primario)</text>
  <line x1="130" y1="676" x2="420" y2="676" stroke="#d9dbd3" stroke-width="1"/>
  <text x="275" y="694" text-anchor="middle" font-size="14.9" fill="#333">Docker Compose completo:</text>
  <text x="275" y="712" text-anchor="middle" font-size="14.2" fill="#333">auth · empleados · calendario</text>
  <text x="275" y="728" text-anchor="middle" font-size="14.2" fill="#333">inventario · reservas · chat · postgres</text>
  <text x="275" y="750" text-anchor="middle" font-size="14.2" fill="#666">eth0: 10.10.10.10 (vmbr1 — única interfaz)</text>
  <text x="275" y="772" text-anchor="middle" font-size="14.2" fill="#8a5a1c" font-weight="600">cron pg_dump cada 15 min → crm-core-b</text>
  <text x="275" y="792" text-anchor="middle" font-size="14.2" fill="#8a5a1c" font-weight="600">Sin entrada directa ni salida a Internet</text>

  <rect x="760" y="626" width="330" height="184" rx="10" fill="#fbfbfa" stroke="#8a8f8a" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="925" y="652" text-anchor="middle" font-size="20.3" font-weight="700" fill="#161b1a">crm-core-b</text>
  <text x="925" y="668" text-anchor="middle" font-size="14.9" fill="#535e5c">4 vCPU / 6 GB — RÉPLICA PASIVA</text>
  <line x1="780" y1="676" x2="1070" y2="676" stroke="#d9dbd3" stroke-width="1"/>
  <text x="925" y="694" text-anchor="middle" font-size="14.9" fill="#333">Mismo Docker Compose completo,</text>
  <text x="925" y="712" text-anchor="middle" font-size="14.2" fill="#333">recibiendo los volcados replicados</text>
  <text x="925" y="750" text-anchor="middle" font-size="14.2" fill="#666">eth0: 10.10.10.11 (vmbr1 — única interfaz)</text>
  <text x="925" y="772" text-anchor="middle" font-size="14.2" fill="#8a8f8a" font-weight="600">Promoción a primario: MANUAL</text>
  <text x="925" y="792" text-anchor="middle" font-size="14.2" fill="#8a8f8a" font-weight="600">(runbook en infra/ansible/README.md)</text>

  <path d="M 440 726 L 760 726" fill="none" stroke="#8a5a1c" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="600" y="716" text-anchor="middle" font-size="13.5" fill="#8a5a1c">réplica cada 15 min</text>
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8a5a1c"/>
    </marker>
  </defs>

  <!-- Nota de limites -->
  <rect x="110" y="822" width="980" height="62" rx="8" fill="#eceee8" stroke="#d9dbd3" stroke-width="1"/>
  <text x="130" y="842" font-size="16.2" font-weight="700" fill="#161b1a">Qué protege esta redundancia, y qué no</text>
  <text x="130" y="859" font-size="14.2" fill="#535e5c">Protege contra fallas de software/VM (servicio colgado, bug, VM caída), no contra la falla del PC físico completo.</text>
  <text x="130" y="875" font-size="14.2" fill="#535e5c">Eso requiere el segundo servidor físico en cotización (migración en vivo real).</text>

  <text x="70" y="920" font-size="13.5" fill="#8a8f8a">VMware (donde vive Proxmox) + Proxmox/KVM (donde viven las VMs) son dos tecnologías de virtualización distintas.</text>
  <text x="70" y="936" font-size="13.5" fill="#8a8f8a">Actualizado 2026-09-25 — esquema de red NAT (VMnet8): la infraestructura no depende de la red Wi-Fi externa.</text>
</svg>
