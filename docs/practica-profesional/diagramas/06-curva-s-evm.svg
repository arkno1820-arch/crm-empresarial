<svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="620" fill="#f4f5f2"/>
  <text x="500" y="36" text-anchor="middle" font-size="26" font-weight="700" fill="#161b1a">Línea Base de Valor Planificado (PV) — 360 horas de práctica</text>
  <text x="500" y="58" text-anchor="middle" font-size="15" fill="#535e5c">Informe entregado antes del inicio de la práctica (28-sep-2026): solo existe PV, EV y AC se actualizan en cada informe de avance</text>

  <!-- Axes -->
  <line x1="90" y1="470" x2="920" y2="470" stroke="#333" stroke-width="1.5"/>
  <line x1="90" y1="90" x2="90" y2="470" stroke="#333" stroke-width="1.5"/>
  <text x="505" y="505" text-anchor="middle" font-size="14" fill="#535e5c">Fase de la práctica (F1-F8)</text>
  <text x="35" y="280" text-anchor="middle" font-size="14" fill="#535e5c" transform="rotate(-90 35 280)">Horas acumuladas</text>

  <!-- Y gridlines/labels: 0 to 360h -->
  <g font-size="13" fill="#666">
    <text x="80" y="473" text-anchor="end">0</text>
    <text x="80" y="410" text-anchor="end">60</text>
    <text x="80" y="346" text-anchor="end">120</text>
    <text x="80" y="283" text-anchor="end">180</text>
    <text x="80" y="219" text-anchor="end">240</text>
    <text x="80" y="156" text-anchor="end">300</text>
    <text x="80" y="93" text-anchor="end">360</text>
  </g>
  <g stroke="#e5e5e0" stroke-width="1">
    <line x1="90" y1="410" x2="920" y2="410"/>
    <line x1="90" y1="346" x2="920" y2="346"/>
    <line x1="90" y1="283" x2="920" y2="283"/>
    <line x1="90" y1="219" x2="920" y2="219"/>
    <line x1="90" y1="156" x2="920" y2="156"/>
    <line x1="90" y1="93" x2="920" y2="93"/>
  </g>

  <!-- X labels: 8 phases -->
  <g font-size="13" fill="#333">
    <text x="140" y="488" text-anchor="middle">F1</text>
    <text x="240" y="488" text-anchor="middle">F2</text>
    <text x="340" y="488" text-anchor="middle">F3</text>
    <text x="480" y="488" text-anchor="middle">F4</text>
    <text x="580" y="488" text-anchor="middle">F5</text>
    <text x="680" y="488" text-anchor="middle">F6</text>
    <text x="780" y="488" text-anchor="middle">F7</text>
    <text x="880" y="488" text-anchor="middle">F8</text>
  </g>

  <!-- Cumulative PV: 30,70,115,180,210,255,300,360 sobre 360 -> y = 470 - h*1.0556 -->
  <polyline points="90,470 140,438.3 240,396.4 340,349.1 480,280.0 580,248.3 680,201.1 780,154.0 880,90.0"
            fill="none" stroke="#1f6f68" stroke-width="3.5"/>
  <g fill="#1f6f68">
    <circle cx="140" cy="438.3" r="5"/><circle cx="240" cy="396.4" r="5"/><circle cx="340" cy="349.1" r="5"/>
    <circle cx="480" cy="280.0" r="5"/><circle cx="580" cy="248.3" r="5"/><circle cx="680" cy="201.1" r="5"/>
    <circle cx="780" cy="154.0" r="5"/><circle cx="880" cy="90.0" r="5"/>
  </g>

  <!-- Legend -->
  <g font-size="13.5">
    <line x1="650" y1="530" x2="685" y2="530" stroke="#1f6f68" stroke-width="3.5"/>
    <text x="692" y="534" fill="#161b1a">PV — Valor Planificado (línea base, 360h totales)</text>
  </g>

  <!-- Pie explicativo -->
  <rect x="60" y="550" width="880" height="60" rx="8" fill="#eceee8" stroke="#d9dbd3" stroke-width="1"/>
  <text x="80" y="570" font-size="13.5" font-weight="700" fill="#161b1a">Qué muestra este diagrama</text>
  <text x="80" y="588" font-size="12" fill="#535e5c">La línea base de horas planificadas (PV) por fase, acumulada hasta las 360h totales de la práctica. El Valor Ganado (EV) y el Costo</text>
  <text x="80" y="603" font-size="12" fill="#535e5c">Real (AC) — y por tanto el CPI/SPI — se calcularán y agregarán en cada uno de los 3 informes de avance, a medida que exista ejecución real.</text>
</svg>
