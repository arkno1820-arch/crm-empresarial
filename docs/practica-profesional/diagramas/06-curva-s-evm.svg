<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="560" fill="#f4f5f2"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#161b1a">Curva S — Valor Ganado (EVM) por fase</text>
  <text x="450" y="54" text-anchor="middle" font-size="12" fill="#535e5c">Horas estimadas por fase (no hay registro exacto de horas trabajadas) — aproximación con fines de análisis EVM</text>

  <!-- Axes -->
  <line x1="80" y1="440" x2="850" y2="440" stroke="#333" stroke-width="1.5"/>
  <line x1="80" y1="80" x2="80" y2="440" stroke="#333" stroke-width="1.5"/>
  <text x="465" y="475" text-anchor="middle" font-size="11" fill="#535e5c">Fase del proyecto</text>
  <text x="30" y="260" text-anchor="middle" font-size="11" fill="#535e5c" transform="rotate(-90 30 260)">Horas acumuladas</text>

  <!-- Y gridlines/labels: 0 to 110h -->
  <g font-size="9.5" fill="#666">
    <text x="70" y="443" text-anchor="end">0</text>
    <text x="70" y="373" text-anchor="end">20</text>
    <text x="70" y="303" text-anchor="end">40</text>
    <text x="70" y="233" text-anchor="end">60</text>
    <text x="70" y="163" text-anchor="end">80</text>
    <text x="70" y="93" text-anchor="end">100</text>
  </g>
  <g stroke="#e5e5e0" stroke-width="1">
    <line x1="80" y1="373" x2="850" y2="373"/>
    <line x1="80" y1="303" x2="850" y2="303"/>
    <line x1="80" y1="233" x2="850" y2="233"/>
    <line x1="80" y1="163" x2="850" y2="163"/>
    <line x1="80" y1="93" x2="850" y2="93"/>
  </g>

  <!-- X labels: 7 phases -->
  <g font-size="10" fill="#333">
    <text x="150" y="458" text-anchor="middle">F1</text>
    <text x="260" y="458" text-anchor="middle">F2</text>
    <text x="370" y="458" text-anchor="middle">F3</text>
    <text x="480" y="458" text-anchor="middle">F4</text>
    <text x="590" y="458" text-anchor="middle">F5</text>
    <text x="700" y="458" text-anchor="middle">F6</text>
    <text x="810" y="458" text-anchor="middle">F7</text>
  </g>

  <!-- Cumulative data. scale: y = 440 - h*3.5 -->
  <!-- PV cumulative: 20,35,47,57,72,80,90 -->
  <!-- EV cumulative: 20,35,47,57,72,80,90 (100% del alcance se completo) -->
  <!-- AC cumulative: 18,34,48,68,83,97,107 -->

  <polyline points="150,370 260,317.5 370,275.5 480,240.5 590,188 700,160 810,125"
            fill="none" stroke="#1f6f68" stroke-width="3"/>
  <polyline points="150,370 260,317.5 370,275.5 480,240.5 590,188 700,160 810,125"
            fill="none" stroke="#1f6f68" stroke-width="0" stroke-dasharray="0"/>

  <polyline points="150,376 260,321 370,272 480,202 590,150.5 700,101.5 810,65.5"
            fill="none" stroke="#9b3b47" stroke-width="3" stroke-dasharray="7,4"/>

  <!-- markers -->
  <g fill="#1f6f68">
    <circle cx="150" cy="370" r="4"/><circle cx="260" cy="317.5" r="4"/><circle cx="370" cy="275.5" r="4"/>
    <circle cx="480" cy="240.5" r="4"/><circle cx="590" cy="188" r="4"/><circle cx="700" cy="160" r="4"/><circle cx="810" cy="125" r="4"/>
  </g>
  <g fill="#9b3b47">
    <circle cx="150" cy="376" r="4"/><circle cx="260" cy="321" r="4"/><circle cx="370" cy="272" r="4"/>
    <circle cx="480" cy="202" r="4"/><circle cx="590" cy="150.5" r="4"/><circle cx="700" cy="101.5" r="4"/><circle cx="810" cy="65.5" r="4"/>
  </g>

  <!-- Legend -->
  <g font-size="10.5">
    <line x1="610" y1="497" x2="640" y2="497" stroke="#1f6f68" stroke-width="3"/>
    <text x="646" y="501" fill="#161b1a">PV = EV (Planificado = Ganado, 90h)</text>
    <line x1="610" y1="517" x2="640" y2="517" stroke="#9b3b47" stroke-width="3" stroke-dasharray="7,4"/>
    <text x="646" y="521" fill="#161b1a">AC (Costo Real, 107h)</text>
    <text x="610" y="540" font-size="9.5" fill="#666">100% del alcance completado</text>
  </g>

  <!-- KPI box -->
  <rect x="80" y="495" width="480" height="55" rx="8" fill="#eceee8" stroke="#d9dbd3" stroke-width="1"/>
  <text x="95" y="513" font-size="11" font-weight="700" fill="#161b1a">CPI = EV/AC = 90/107 ≈ 0.84</text>
  <text x="95" y="530" font-size="11" font-weight="700" fill="#161b1a">SPI = EV/PV = 90/90 = 1.00</text>
  <text x="95" y="545" font-size="9" fill="#535e5c">Alcance 100% cumplido a tiempo, con ~19% más esfuerzo del estimado</text>
</svg>
