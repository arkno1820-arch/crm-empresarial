repo_url: "https://github.com/arkno1820-arch/crm-empresarial.git"
repo_dest: "/home/{{ ansible_user | default('cesar') }}/crm-empresarial"

# Par de nucleo: crm-core (activo) escribe, crm-core-b (replica) recibe.
crm_core_ip: "10.10.10.10"
pg_secondary_ip: "10.10.10.11"

# Par de borde: IP virtual que Keepalived mueve entre crm-edge y crm-edge-b.
# Ajusta keepalived_interface si tu plantilla no nombra las NIC "eth0"/"eth1"
# (verifica con "ip addr" en la VM tras el primer arranque).
keepalived_vip: "10.10.10.5"
keepalived_interface: "eth0"

microservicios:
  - { nombre: auth, puerto: 8001 }
  - { nombre: empleados, puerto: 8002 }
  - { nombre: calendario, puerto: 8003 }
  - { nombre: inventario, puerto: 8004 }
  - { nombre: reservas, puerto: 8005 }
  - { nombre: chat, puerto: 8006 }
