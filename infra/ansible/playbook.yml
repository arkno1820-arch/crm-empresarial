---
- name: "Configurar el par de borde: Nginx + frontend + Keepalived (VIP)"
  hosts: crm_edge
  become: true
  tags: [borde]
  roles:
    - crm_edge
    - keepalived

- name: "Monitoreo redundante: Uptime Kuma en AMBOS bordes, con monitoreo cruzado entre ellos"
  hosts: crm_edge
  become: true
  tags: [monitoreo]
  roles:
    - uptime_kuma

- name: "Monitoreo EXTERNO: Uptime Kuma en el contenedor crm-mon (fuera de las VMs)"
  hosts: monitor
  become: true
  tags: [monitoreo_externo]
  roles:
    - uptime_kuma

- name: "Arbitro de Patroni: cluster etcd de 3 miembros repartidos en 3 VMs"
  hosts: etcd
  become: true
  tags: [etcd]
  roles:
    - etcd

- name: "Base de datos redundante: PostgreSQL + Patroni + HAProxy en los dos nucleos"
  hosts: crm_core
  become: true
  tags: [base_datos]
  roles:
    - patroni
    - haproxy_pg

- name: "Aplicacion del CRM: activa en ambos nucleos, conectada al primario vigente"
  hosts: crm_core
  become: true
  tags: [app]
  roles:
    - crm_core

- name: "Respaldo (1/3): llave SSH propia de cada nucleo para entregar respaldos"
  hosts: crm_core
  become: true
  tags: [respaldo]
  tasks:
    - ansible.builtin.include_role:
        name: respaldo
        tasks_from: nucleo_clave.yml

- name: "Respaldo (2/3): NAS crm-nas, receptor de solo escritura y limpieza automatica"
  hosts: nas
  become: true
  tags: [respaldo]
  tasks:
    - ansible.builtin.include_role:
        name: respaldo
        tasks_from: nas.yml

- name: "Respaldo (3/3): respaldo diario cifrado de la base de datos en cada nucleo"
  hosts: crm_core
  become: true
  tags: [respaldo]
  tasks:
    - ansible.builtin.include_role:
        name: respaldo
        tasks_from: nucleo.yml
