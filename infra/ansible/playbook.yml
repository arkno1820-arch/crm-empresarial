---
- name: "Configurar el par de borde: Nginx + frontend + Keepalived (VIP)"
  hosts: crm_edge
  become: true
  roles:
    - crm_edge
    - keepalived

- name: "Monitoreo redundante: Uptime Kuma en AMBOS bordes, con monitoreo cruzado entre ellos"
  hosts: crm_edge
  become: true
  roles:
    - uptime_kuma

- name: "Configurar el par de nucleo: Docker + CRM completo + replica de Postgres"
  hosts: crm_core
  become: true
  roles:
    - crm_core
    - pg_replica
