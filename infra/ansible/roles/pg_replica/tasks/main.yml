---
# Replica de Postgres entre crm-core (primario) y crm-core-b (secundario).
# La PROMOCION a primario es MANUAL a proposito (ver README de infra/ansible)
# - automatizarla de forma segura exige deteccion de split-brain, algo que no
# se justifica a esta escala.

- name: Generar una llave SSH dedicada a la replicacion (solo en el primario)
  ansible.builtin.command:
    cmd: ssh-keygen -t ed25519 -N "" -f /home/{{ ansible_user }}/.ssh/id_replica
    creates: /home/{{ ansible_user }}/.ssh/id_replica
  when: pg_role == 'primary'

- name: Leer la llave publica de replicacion (primario)
  ansible.builtin.slurp:
    src: /home/{{ ansible_user }}/.ssh/id_replica.pub
  register: replica_pubkey_raw
  when: pg_role == 'primary'

- name: Autorizar la llave del primario en el secundario
  ansible.builtin.lineinfile:
    path: /home/{{ ansible_user }}/.ssh/authorized_keys
    line: "{{ hostvars['crm-core']['replica_pubkey_raw']['content'] | b64decode | trim }}"
    create: true
    mode: "0600"
  when: pg_role == 'secondary'

- name: Crear carpeta de trabajo de la replicacion (primario)
  ansible.builtin.file:
    path: /home/{{ ansible_user }}/pg_replica
    state: directory
    mode: "0700"
  when: pg_role == 'primary'

- name: Desplegar el script de replicacion (primario)
  ansible.builtin.template:
    src: replica_push.sh.j2
    dest: /home/{{ ansible_user }}/pg_replica/replica_push.sh
    mode: "0700"
  when: pg_role == 'primary'

- name: Programar la replicacion cada 15 minutos (primario)
  ansible.builtin.cron:
    name: "pg_replica hacia crm-core-b"
    minute: "*/15"
    job: "/home/{{ ansible_user }}/pg_replica/replica_push.sh >> /home/{{ ansible_user }}/pg_replica/replica.log 2>&1"
    user: "{{ ansible_user }}"
  when: pg_role == 'primary'
