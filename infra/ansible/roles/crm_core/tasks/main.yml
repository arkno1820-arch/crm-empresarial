---
- name: Instalar dependencias para agregar el repositorio oficial de Docker
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - git
    state: present
    update_cache: true

- name: Crear directorio para la llave GPG de Docker
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Descargar la llave GPG oficial de Docker
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Agregar el repositorio oficial de Docker (docker-compose-plugin no esta en los repos base de Ubuntu)
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present
    filename: docker

- name: Instalar Docker, el plugin de compose y Git
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
      - git
    state: present
    update_cache: true

- name: Agregar el usuario al grupo docker (para no necesitar sudo con docker)
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: docker
    append: true

- name: Clonar o actualizar el repositorio del CRM
  ansible.builtin.git:
    repo: "{{ repo_url }}"
    dest: "{{ repo_dest }}"
    version: main
    force: true

- name: Verificar que el .env real ya este copiado (nunca vive en git)
  ansible.builtin.stat:
    path: "{{ repo_dest }}/.env"
  register: env_file

- name: Detener si falta el .env
  ansible.builtin.fail:
    msg: >-
      Falta {{ repo_dest }}/.env en crm-core. Cópialo antes de correr este
      playbook, de un salto desde tu PC (a través de crm-edge):
      scp -o ProxyJump=cesar@172.20.10.11 .env cesar@10.10.10.10:{{ repo_dest }}/.env
  when: not env_file.stat.exists

- name: Retirar el PostgreSQL local heredado, si existe (la base vive ahora en Patroni; el volumen se conserva)
  ansible.builtin.shell: docker compose rm -sf postgres
  args:
    chdir: "{{ repo_dest }}"
  changed_when: false
  failed_when: false

- name: Levantar la aplicacion del CRM (activa en ambos nucleos; la base de datos vive en Patroni)
  ansible.builtin.shell: docker compose -f docker-compose.yml -f docker-compose.ha.yml up --build -d
  args:
    chdir: "{{ repo_dest }}"
