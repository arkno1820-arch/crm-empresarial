---
- name: Instalar Nginx y Git
  ansible.builtin.apt:
    name:
      - nginx
      - git
    state: present
    update_cache: true

- name: Clonar o actualizar el repositorio del CRM (para servir el frontend)
  ansible.builtin.git:
    repo: "{{ repo_url }}"
    dest: "{{ repo_dest }}"
    version: main
    force: true

- name: Crear directorio para la llave privada del certificado
  ansible.builtin.file:
    path: /etc/ssl/private
    state: directory
    mode: "0710"

- name: Copiar el certificado de crm-edge firmado por la CA privada
  ansible.builtin.copy:
    src: crm-edge.crt
    dest: /etc/ssl/certs/crm-edge.crt
    mode: "0644"
  notify: Reiniciar Nginx

- name: Copiar la llave privada del certificado
  ansible.builtin.copy:
    src: crm-edge.key
    dest: /etc/ssl/private/crm-edge.key
    mode: "0640"
  notify: Reiniciar Nginx

- name: Copiar el certificado raiz de la CA privada (para distribuir y para que la VM tambien confie en ella)
  ansible.builtin.copy:
    src: ca.crt
    dest: /usr/local/share/ca-certificates/crm-ca.crt
    mode: "0644"
  register: ca_copiada

- name: Registrar la CA en los certificados de confianza del sistema
  ansible.builtin.command: update-ca-certificates
  when: ca_copiada.changed

- name: Desplegar la configuracion de Nginx (proxy hacia crm-core)
  ansible.builtin.template:
    src: nginx-crm-edge.conf.j2
    dest: /etc/nginx/sites-available/default
  notify: Reiniciar Nginx

- name: Habilitar y arrancar Nginx
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
