---
# Uptime Kuma corre en AMBOS bordes (crm-edge y crm-edge-b), cada uno con su propia
# base local. Ambos tienen vista hacia la red interna (vmbr1), asi que pueden monitorear
# el par de nucleo, y cada uno vigila tambien a su par: si un borde cae, el otro sigue
# monitoreando y detecta la caida (antes, al apagar crm-edge se caia todo el monitoreo).
# Nativo (Node.js), no Docker, para mantener el principio de diseno de los bordes.
#
# Sembrado inicial de crm-edge-b sin descargar dependencias por Internet: copiar
# /opt/uptime-kuma desde crm-edge por la red interna (tar por SSH). "npm run setup"
# tiene un "creates" que se salta al encontrar dist/index.html.

- name: Agregar el repositorio oficial de NodeSource (Ubuntu trae una version de Node muy vieja)
  ansible.builtin.shell: curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
  args:
    creates: /etc/apt/sources.list.d/nodesource.list

- name: Instalar Node.js
  ansible.builtin.apt:
    name: nodejs
    state: present
    update_cache: true

- name: Clonar Uptime Kuma (version fija, no "master" -- esa rama es de desarrollo)
  ansible.builtin.git:
    repo: https://github.com/louislam/uptime-kuma.git
    dest: /opt/uptime-kuma
    version: "2.5.5"
  register: kuma_clonado

- name: Dar el directorio a cesar (npm no debe correr como root)
  ansible.builtin.file:
    path: /opt/uptime-kuma
    owner: cesar
    group: cesar
    recurse: true

- name: Instalar dependencias y compilar el frontend (npm run setup, solo la primera vez)
  ansible.builtin.command:
    cmd: npm run setup
    chdir: /opt/uptime-kuma
    creates: /opt/uptime-kuma/dist/index.html
  become: true
  become_user: cesar

- name: Desplegar el servicio systemd de Uptime Kuma
  ansible.builtin.template:
    src: uptime-kuma.service.j2
    dest: /etc/systemd/system/uptime-kuma.service
  notify: Reiniciar Uptime Kuma

- name: Habilitar y arrancar Uptime Kuma
  ansible.builtin.systemd:
    name: uptime-kuma
    state: started
    enabled: true
    daemon_reload: true
