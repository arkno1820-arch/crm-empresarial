# Este inventario asume que corres "ansible-playbook" DESDE DENTRO de crm-edge,
# no desde tu PC Windows. Razon: Ansible no corre nativo en Windows sin WSL, y
# ya decidimos no usar WSL (compite por VT-x con la virtualizacion anidada de
# Proxmox). crm-edge tiene ruta directa a crm-core/crm-core-b por vmbr1 y a
# crm-edge-b por vmbr1 (red interna), asi que no hace falta salto (ProxyJump).
#
# Par de borde (redundante con Keepalived/VRRP):
[crm_edge]
localhost ansible_connection=local keepalived_state=MASTER keepalived_priority=150
crm-edge-b ansible_host=10.10.10.3 ansible_user=cesar keepalived_state=BACKUP keepalived_priority=100

# Par de nucleo: DOS nodos PostgreSQL bajo Patroni (conmutacion automatica) y la
# aplicacion activa en ambos (stateless, detras del upstream del borde).
[crm_core]
crm-core ansible_host=10.10.10.10 ansible_user=cesar patroni_name=crm-core
crm-core-b ansible_host=10.10.10.11 ansible_user=cesar patroni_name=crm-core-b

# Cluster etcd de 3 miembros repartidos en 3 VMs distintas: la caida de UNA
# cualquiera deja mayoria (2 de 3) y Patroni puede seguir eligiendo primario.
# Es el arbitro que evita el split-brain sin necesitar un tercer servidor.
[etcd]
localhost ansible_connection=local etcd_name=crm-edge etcd_ip=10.10.10.2
crm-edge-b ansible_host=10.10.10.3 ansible_user=cesar etcd_name=crm-edge-b etcd_ip=10.10.10.3
crm-core-b ansible_host=10.10.10.11 ansible_user=cesar etcd_name=crm-core-b etcd_ip=10.10.10.11
