# Este inventario asume que corres "ansible-playbook" DESDE DENTRO de crm-edge,
# no desde tu PC Windows. Razon: Ansible no corre nativo en Windows sin WSL, y
# ya decidimos no usar WSL (compite por VT-x con la virtualizacion anidada de
# Proxmox). crm-edge tiene ruta directa a crm-core/crm-core-b por vmbr1 y a
# crm-edge-b por vmbr1 (red interna), asi que no hace falta salto (ProxyJump).
#
# Par de borde (redundante con Keepalived/VRRP):
[crm_edge]
localhost ansible_connection=local keepalived_state=MASTER keepalived_priority=150
crm-edge-b ansible_host=10.10.10.3 ansible_user=cesar keepalived_state=BACKUP keepalived_priority=100

# Par de nucleo (crm-core activo, crm-core-b replica pasiva):
[crm_core]
crm-core ansible_host=10.10.10.10 ansible_user=cesar pg_role=primary
crm-core-b ansible_host=10.10.10.11 ansible_user=cesar pg_role=secondary
